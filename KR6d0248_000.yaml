front:
  text: 法界安立圖自序聞夫四徵未具本無臭以無聲二儀攸分遂有形而有象形質既立依正斯分于是十方世界而棋布星羅六道含靈而塵紛蟻聚有名有體孰能盡見盡知有種有因難以窮其繇始況復神機吐納業運遷訛出沒無方化化無際者乎非夫至聖至神大覺玄鑒惡能狒其涯岸哉致使凡庸闇識耳聾瞽而不知世智辨聰封己見而莫信所以道岸轉遙真源難復更有愚癡邪說執理迷事受一非餘撥無佛土耽空為道墮莽蕩之深坑妙有不弘損人天之福德適越之燕求升返墜雖智愚有間昧道何殊葢不明乎因果凡聖故也夫因果者自心之影嚮耳因果明則操脩之具可知也凡聖者迷悟之分位耳凡聖明則升進之功可期也法界者乃聖凡之依報猶人之屋廬也皆從心變心造非是無因無緣是故剎海無邊攝歸毫末橫該竪徹總會心源如是知為真知不爾非真知也知見既正則信入無疑趨向有堦聖凡不濫聞熏觀達至於洞融方能空有無礙真俗圓通福智兩嚴大通自在方為究竟然歸源無二方便多門今此集中略明有門謂人天世界凡聖因果皆是實有非寓言假設若夫空空妙理無我無人絕修絕證生佛一如之奧義自有八部般若諸大經論在竊以通都大郡有大藏有明哲處加此則為骿贅但山陬海曲窮年不聞正法頭白未謗因果者以此開發善信不無小益故彚集成言以為法施之助云爾萬曆丁未仲秋沙門仁潮集於天目蘭若法界安立圖總目卷上之上一略明南洲一十六則卷上之下二廣步大地二十五則卷中之上三徧觀三界二十二則卷中之下四大千劫量一十六則卷下之上五游諸佛剎一十九則卷下之下六研窮法界六則七法界總論一十一則總釋大意數一至七從凡至聖自近而遠通為一觀如入大海轉入轉深方知世界無邊眾生無數而真法界量亦無有盡然則離事無理離理無事性相不二體用同如總為法界一大緣起故經云終無心外境能與心為緣皆是自心生還與心為相以色大故般若大色清淨故般若清淨也法界安立圖別目卷上之上一略明南洲佛興緣賢劫緣娑婆疆域震旦國圖南贍部洲圖別胡梵說論地中有九義一名聞二里分三山王四水源五地臍六輪王七梵書八氣和九中道論僊道斷疑生信題注千里之程起于跬步將游法界發軫人間葢世界廣遠人莫能知故略示方隅初明一洲漸及遠大如增十為百積流成海也
