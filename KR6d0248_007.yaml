body:
  text: 燕山沙門仁潮集六研窮法界六則十方剎海圖釋大數名通觀剎海翱翔法界佛光觀法界無盡七法界總論十則四土圓融圖依正通論四土淨穢五土淨穢同處異見色因識變圖共造義自在義心造法界圖念具三千圖法界直指圖法界者心之別目蓋心之體用深廣性相無礙即是以心為法以心為界安立者心之妙相分齊莊嚴各各建立不相雜亂也圭峰禪師云未明理事不說有空直指本覺靈源故曰一真法界從一真法界分出理法界事相光虗皆同一性事法界萬法森然各有分限理事無礙法界以理融事會事歸理事事無礙法界塵塵無礙法法融通法以軌則為義界以性分為義此真空軌則之法在理為理法界在事為事法界等蓋理無分限事有千差古德云春色無高下花枝有短長今此集略明事法界爾亦即理之事十方剎海圖如來現相品云此華藏莊嚴世界海東方次有世界海名清淨光蓮華莊嚴彼世界種中有國土名摩尼瓔珞金剛藏佛號法水覺虗空無邊王于彼如來大會海中有菩薩名觀察勝法蓮華幢與世界海微塵數諸菩薩俱來詣佛所南西北方四維上下經文共有十段如是十億佛剎微塵數世界海中有十億佛剎微塵數菩薩各與諸菩薩俱來詣佛所又入法界品云爾時東方過不可說佛剎微塵數世界海外有世界名金燈雲幢佛號毗盧遮那勝德王彼佛衆中有菩薩摩訶薩名毗盧遮那願光明與不可說佛剎微塵數諸菩薩俱來向佛所興諸供養雲南西北方四維上下經文十段則十方共有十不可說佛剎微塵數世界海也統名十法界安立海釋大數名不可說者大數之名也此數唯佛盡知故心王菩薩請問數名之義世尊親說阿僧祇品明佛德數量世數所不及也按苑法師華嚴經注云按此方黃帝算法總有二十三數謂一二三四五六七八九十百千萬億兆京姟秭壤溝㵎正載也從萬以去有三等數法其下者十十變之中者百百變之上者倍倍變之今阿僧祇品用中上數法初數便云一百洛叉此云萬為一俱胝云億俱胝俱胝為一阿庾多兆阿庾多阿庾多為一那由他京頻婆羅姟矜羯羅秭阿伽羅壤最勝溝摩婆羅㵎阿婆羅正多婆羅載也此方數盡多婆羅多婆羅為一界分界分界分為一普摩如是倍倍轉增至一百二十翻為一不可說數則非世間之算數也棗柏華嚴論阿僧祇品解與苑注大同小異大槩以數此類未必全同佛剎微塵數者大千世界名一佛剎將大千界內百億須彌四洲輪圍及大地等盡皆細磨為塵名一佛剎微塵以一微塵計一世界計前所磨之塵盡名一佛剎微塵數世界經中以世界極多非世數可紀故每以佛剎微塵數計之曰一佛剎塵二佛剎塵乃至多多剎塵以剎塵之數或計世界或計浮幢或計香水海或計安立海等通觀剎海十方剎海遍布虗空香海華幢德均義等經雖隱略例觀可知據現相品云此華藏莊嚴世界海東方次有世界海名清淨光蓮華莊嚴彼世界種中有國土名摩尼瓔珞金剛藏佛號法水覺虗空無邊王于彼如來大會海中有菩薩名觀察勝法蓮華幢乃至詣佛興供等此文隱略假如東方法水覺佛說法時即云此清淨光蓮華莊嚴世界海西方次有世界海名蓮華藏莊嚴彼世界種中有國土名娑婆佛號釋迦牟尼于彼如來大會海中有菩薩名彌勒來詣佛所餘九方例此即知剎種義均是則總十方十億佛剎微塵數世界海中香海浮幢與中央世界海中安立莊嚴其相無異又入法界品云爾時東方過不可說佛剎微塵數世界海外有世界名金燈雲幢佛號毗盧遮那勝德王彼佛衆中有菩薩摩訶薩名毗盧遮那願光明來向佛所此文則又略其世界海及世界種也亦如彼佛為主乃云爾時西方過不可說佛剎微塵數世界海外有世界名娑婆佛號釋迦牟尼彼佛衆中有菩薩摩訶薩名彌勒來向佛所餘九方亦例此如是推之則知總十方十不可說佛剎微塵數世界海據十段經文之總數有十不可說佛剎微塵數廣大蓮華為所依持如蕊香幢等十方諸剎海皆如中央一一大蓮華上各有大金剛輪圍山一一輪圍山內各有十不可說佛剎微塵數香水海如無邊妙華光香水海等一一香水海中出一蓮華如一切香摩尼王莊嚴蓮華等一一蓮華上有一世界種如普照十方熾然寶光明世界種等一一世界種中皆有二十重世界于中布列如娑婆世界八方上下諸世界等其諸浮幢皆上齊諸寶雲下齊諸寶地寶地為華幢所持華幢下有大香水海此海有二義若此海外有輪圍山者則各各分際各各名號如普光摩尼莊嚴香水海等下有風輪如殊勝威光藏風輪等若此海外無輪圍山者則八方諸大華王同在普光香水海中如蓮池然其香水瀰漫遍周法界莫可測其涯際矣齊此總名為一法界安立海也翱翔法界研窮法界高廣無極展演心光鎣覺體自內之外從近之遠廓徹洞融遍周空界初從我等現居國土曰娑婆八方有十三佛剎微塵數世界圍繞向上經七佛剎微塵數世界至浮幢之頂以上乃太虗空向下度十二佛剎微塵數世界至世界之種即寶光明世界種也如是東行度一種十種百種千種萬億兆京乃至正載數種恆沙數種一洲塵數四洲塵數須彌塵數小千塵數中千塵數以至大千世界微塵數世界種如是一佛剎塵十百千剎至正載剎塵展轉至于阿僧祇剎塵乃至不可說佛剎微塵數世界種方至極東大金剛山下如東方次南方次右旋九方亦如是周極輪圍是為華藏世界海邊疆也復從此剎海東行度一輪圍一輪圍內有一世界海二三輪圍十百千輪圍洛叉俱胝那由他恆沙輪圍小千中千大千塵數十佛剎塵百千剎塵阿僧祇剎塵乃至不可說佛剎微塵數金剛輪圍山又一輪圍即極東方金燈雲幢世界如東方南西北方及四隅亦如是共八不可說佛剎微塵數世界海皆豎高十九佛剎微塵數世界上齊寶雲下齊寶地最下極于風輪統八極為法界安立海之邊際也安立海名詳後研究至此至廣至大無量無邊斯似乎極然猶未也等而上之尚有上下方故若爾則彼華藏莊嚴世界海浮幢之上空曠無窮復有風輪如平等住風輪有須彌山微塵數持上大海如普光海華幢如蕊香幢剎海如下華藏世界海如是上行過一剎海復過十剎海百千萬億超諸世數乃至不可說佛剎微塵數剎海最上方至于說佛種性無有盡世界普智輪光明音佛所上方極盡又復彼華藏莊嚴世界海最下風輪名平等住其風輪下空曠莫測復有諸浮幢如寶光明種上二十層等華王如蕊香幢香海如普光海風輪如上殊勝威光藏等須彌山微塵數其下渡虗空至第二剎海下方第二世界海也又渡第三第四十百千萬乃至非世所知不可說佛剎微塵數世界海最下方至于一切如來圓滿光普照世界虗空無礙相智幢王佛所下方至極總法界十方而觀之則華藏周匝得八數上下得二數如豎軸水車輪狀上下孤豎如軸八方周輳如幅及傘蓋形如是揆之亦未可為盡何也今會華藏為主而十方乃有多剎塵數之伴則上下諸佛剎海豈獨無伴乎是知經文含隱詳夫上下方之剎海一一各有衆多塵數剎海圍繞一如華藏八方之數如是則八方齊等上下相當風輪香海重重相間華王剎海行行相當譬如百千大蓮華池遍立空界嗚呼孰能縱金剛翮豁天眼光而遊觀此廣大法界者哉即使邁過斯界四顧茫茫而太虗空外復何物邪又復諦審諦觀十方剎海亦非止此而已矣是以諸佛境界廣大無邊非入大解脫得大三昧莫能見之為啓凡愚故下本經文略言毫末而已下本文亦未全尚有十品存于天竺中上本經當更有餘義信乎須彌量筆大海量墨莫能書也大千塵偈大地塵品未足為多原極于此則情忘智絶廓然無思矣噫回視我輩蕞爾之身心寸靈之知覺類夫醯雞處于太虗浮漚流于大海存邪亡邪恍乎惚乎如夢想焉如幻化焉罔知所以然而然者也故經云十方虗空生汝心中猶如片雲點太清裡如法界性究竟圓滿遍十方故豈欺我哉是故理極故令事廣花大故省池深佛光觀華嚴論云如經中第二會普光明殿中說十信法門世尊從兩足輪中放百億光明遍照三千大千世界修行者當隨佛光作光明想遍于三千大千世界此想成已次觀光明過此大千照東方十大千南方乃至上下方亦各十大千如是一周竟次觀光明過十至百過百至千過千至萬乃至無量不可說世界光遍虗空令其自心亦遍虗空心同虗空其心自定朗然安樂方從定還起十方觀周遍推求自心內外都無所有方始了知空慧現前名憶念諸佛智慧光明普見法門在此位中定亂俱忘名初發心住以此空慧觀諸世間一切衆生及以國土皆如幻化無有體相同佛空慧解脫法門入佛知見已以此名念佛門以無念正慧相應故入十方境界念佛門空慧自性普周遍故及一切佛成正覺轉法輪三世劫在一時無時分延促之相可安立故法界無盡道曠無涯法界無量衆生無數業化無窮諸佛悲智亦無有盡毗盧法身無處不遍方廣妙法在在恆宣如善知識寂靜音海主夜神云次值毗盧遮那如來于此道場成等正覺念念示現大神通力我時得見即獲此念念出生廣大喜莊嚴解脫得此解脫已能入十不可說不可說佛剎微塵數法界安立海見彼一切安立海一切佛剎所有微塵一一塵中有十不可說不可說佛剎微塵數佛國土一一佛土皆有毗盧遮那如來坐于道場于念念中成等正覺現諸神變一一皆遍一切法界海亦見自身在彼一切諸如來所又亦聞其所說妙法又亦見彼一切諸佛一一毛孔出變化海現神通力于一切法界海一切世界海一切世界種一切世界中隨衆生心轉正法輪七法界總論四土圓融圖慈照宗主云寂光同居一智無殊情生彼此見有親疏覿面了色空性如如本無二路自見妙粗吾不如是一體毗盧惺惺寂寂如淨明珠照徹心體凡聖同途四土合轍三身一如頭頭淨土處處阿彌削去迷情頓明心地無量法門收歸方寸優曇大師偈四土非方域情生礙不通悟迷分大小淨穢隔西東萬有形雖別千機理自同春風俱一拂何處不花紅依正通論十方世界無量無邊一切含靈無窮無數總而言之不過依正別則十四種謂依報國土有四種正報有情有十種十種者謂四聖六凡也言四種者曰寂光曰實報曰方便曰同居也問何等有情依何國土曰諸佛究竟極果居常寂光土法身大士居實報土三乘聖人居方便土六凡衆生居同居土曰若爾則域各殊凡聖亦異云何云娑訶世界為釋迦佛土清涼補陀為菩薩聖境邪曰諸佛極果理居寂光攝化有情亦居下三土然佛身有三種一法性身居于寂光土二報身居實報土三應化身居方便土及同居土釋迦乃化身佛也佛為教主故云佛之剎也菩薩以助佛轉輪故亦從之如某郡主之郡也上言三身居四土問若然釋迦為化身者云何經云娑媻世界其佛即是毗盧遮那曰對機說異而其體常一凡夫二乘見者名為應身隨六道所見各各不同諸菩薩見者名為報身有無量相好依報有無量莊嚴若得淨心所見微妙其用轉盛乃至菩薩地盡見之究竟若離業識則無見相以諸佛法身無有彼此色相迭相見故問若諸佛法身離于色相者云何能現色相曰即此法身是色體故能現于色所謂從本已來色心不二以色性即智故色體無形說名智身以智性即色故說名法身遍一切處所現之色各各差別皆無分齊而不相妨此非心識分別能知以真如自在用故法身如來名毗盧遮那此云遍一切處報身如來名盧舍那此云淨滿應身如來名釋迦牟尼此云能仁寂默此三如來一必具三三即是一不一不異非縱非橫圓覽三法假名如來隨順世間而論三身此明三身一體問若三身即一體者云何一體住四土邪曰雖隨機分四然非異處但同處異見耳四土淨穢觀經疏云四種淨土謂凡聖同居土方便有餘土實報無障礙土常寂光土各有淨穢五濁輕重同居淨穢體析巧拙有餘淨穢次第頓入實報淨穢分證究竟寂光淨穢娑媻雜惡荊棘瓦礫不淨充滿同居穢也安養清淨池流八德樹列七珍次于泥洹皆正定聚凡聖同居上品淨也方便有餘者修方便道斷四住惑故曰方便無明未盡故曰有餘智論云出三界外有淨土聲聞辟支佛出生其中受法性身非分段生就中復有利鈍故論淨穢也實報無障礙者行真實法感得勝報色心不相妨故言無障礙純菩薩居無有二乘仁王經云三賢十聖住果報華嚴云無量香雲臺即其土淨妙五塵就中次第頓入更論淨穢也常寂光者常即法身寂即解脫光即般若是三點不縱橫竝別名祕蜜藏諸佛如來所遊居處真常究竟極為淨土分得究竟上下淨穢耳五土淨穢淨土論云土有五種一純淨土唯在佛果二淨穢土謂淨多穢少即八地已上三淨穢平等土謂從初地乃至七地四穢淨土謂穢多淨少即地前性地五雜穢土謂未入性地即凡夫所居土第五人見後一不見前四第四人見後二不見前三第三人見後三不見前二第二人見後四不見前一第一佛上下五土悉知悉見也注凡五上人皆下不知上上能知下也五不見四凡不知聖也四不見三小聖不知中聖也三不見二中聖不知大聖也二不見一則大聖不知至聖也第一人唯佛至聖滿覺故五土悉見聖凡悉知同處異見或問佛土生土為同在一處為各在異處曰同在一處曰既同處則劫火壞時應同散滅可得然乎曰劫火壞世佛土不壞何則衆生惡業故別業妄見故菩薩善業故佛無如是業故所以華嚴云一一剎種中劫燒不思議所現雖敗惡其處常堅固法華云衆生見劫盡大火所燒然我此土安隱天人常充滿故知不壞然滅雖不俱而起必同處雖曰同處而佛土不壞注壞者是變化土不壞者是自他受用土以業不同故同處異見曰土在同處我何不見曰業報不同故如人于餓鬼火處見水餓鬼于人水處見火雖曰同處而各不相見唯同業者乃能見耳亦如藥叉宮殿與人宮殿同在一處互不相見他受用土亦復如是若自受用土故是周遍不即不離若法性土起滅常如故佛土不可以存滅染淨而思矣如維摩經螺髻梵王見釋迦佛土清淨如自在天宮舍利弗見此土坑坎穢惡乃疑念若菩薩心淨則佛土淨我世尊意豈不淨而是佛土不淨若此佛言日月明淨盲者不見非日月咎佛以足指按地即時三千大千世界若干百千珍寶嚴飾譬如寶莊嚴佛無量功德寶莊嚴土一切大衆歎未曾有佛語舍利弗我佛土常淨若此為欲度斯下劣人故示是衆惡不淨土耳譬如諸天共寶器食隨其福德飯色有異若人心淨便見此土功德莊嚴羅什注稱適衆心故現國不同螺髻所見如自在天宮者復是見其所應見耳而未盡其淨也下言如寶莊嚴佛國始見釋迦真報應淨國淨國即在此世界如法華壽量品中云云此淨穢同處而不相雜如一器中有二種食應二種衆生又李長者云維摩經淨土是實報土未具明廣問如前所言則諸佛國土定是實有云何經言諸佛國土猶如虗空曰法身無相應物故形真土無方隨機而現衆生善業故諸佛本願故法如是故經偈云諸佛國土如虗空無等無生無有相為利衆生普嚴淨本願力故住其中疏云彰淨國之意使效而行之前半智境嚴即無嚴謂自受用土周遍無等法性之土體性無生二皆無相後半悲應無嚴之嚴嚴遍法界無住之住常住剎中心應下後半即他受用及變化淨一偈之中四土如是則佛土不可以有無度之但隨悲智隱顯利物耳色因識變圖謂真妄和合非一非異名阿賴耶識即第八識此第八識分為見相二分見分變出眼等七識相分變成根身器界內六根有執受故為親相分外器界無執受故為疏相分此二種相分皆四大所成四大為能造依正為所造八識是能變之主詳具唯識論或問一切世界因何而有造者為誰曰因心而有唯心所造夫一切衆生自無始來迷真合妄而成阿賴耶識此云藏識以能攝藏諸法種子因此識故變似根身器世界等故經云無始時來界界因也即種子識無始相續親生諸法故一切法等依由此有諸趣六趣生死由八識而流轉及涅槃證得四聖修行亦由此而得道又云三界無別法唯是一心造一切因果十法界諸因果世界微塵淨穢等諸世界因心成體心為能造依正為所成體又問若識變似世界等為是各各變為是共變曰此義幽奧應四義分別共不共義宗鏡録云一共中共變由八識共相種成熟力故變似色等器世間相雖諸有情所變各別而相似處所無異如衆燈明各遍似一多人所感多人受用如無主山河衆人共業力變又共得受用重名為共非一趣用他不能用佛言一人發真歸元十方虛空悉皆銷殞且古來發真得道者多而世界元在者豈聖言之無徵而修行者不至歟曰非也發真者界實消然所消者自變之分耳其元在者共變之境也以共義故世界猶存以不共義故說消殞也如一燈滅除燈尚明果衆皆發真則十方俱消無疑二共中不共若唯識理各各自變各自受用今且約自身能用他不得用名為不共如有主山河亦如自己田宅等及鬼等所見猛火等物人見為水餘趣餘人不能用故三不共中共如自扶根塵他亦受用即內扶根塵初唯自第八變故名不共變後他人亦有受用名共如淫女等四不共中不共如眼等根唯自識依用非他用故眼識唯依眼根發乃至身識唯依身根發等問色從識變者無色界天無有色相云何說變曰下界衆生所見是業果色無色界現境是定果色入定時亦有寶宮殿等俱不離心華嚴云菩薩鼻根聞無色界宮殿之香阿含云舍利弗入涅槃時色無色天宮中淚下如春雨波闍波提入涅槃時色無色天佛邊側立以此而知雖無粗色亦有細色故亦從心變是故佛言三界唯心萬法唯識自在不自在義又相違識相者謂彼四類有情能變之識各相違故致令所變之境亦乃相違故天見是寶嚴地魚見是窟宅人見是清冷水鬼見是膿河猛火由四類有情先業之力共相一處各變相分不同又如人見糞穢處傍生見為淨妙飲食人見淨妙飲食諸天見為臭穢故知隨福見異垢淨唯心業自差殊食無粗細又以慳吝業故見濃滿河流溢然餓鬼等雖同趣見亦差別或有見大熱圍融煮迸灒或見屎尿橫流若相不一又雖同人趣薄福之人金帶見為鐵鎖或見是蛇或見金銀為水為瓦礫等又天人同器而食上福者白色薄福者見黃赤色又色自在相者謂八地以去菩薩相及土皆得自在以上品定心有大勢力能任運變大地為黃金攪長河為酥酪此是境隨真智轉所變事皆成一切諸妙境如華嚴會上菩薩興種種供雲寶蓋樓閣珠網等皆不離菩薩能變之心乃至異生亦能變化如變水為火餓鬼變晝為夜梟等變鐵為金仙等變夜為晝鬼國此皆是境隨事識轉所變事皆成凡變金銀宮殿者是實定果色初地已去方能變古德云色自在心生故心能變色所以移山覆海倒地翻天變土成金攪河為酪悉無難事當知色法皆隨感現色無定體隨心所變此理元是如來藏中不思議法十大之性一一周遍循業發現為地為水等聖人證此得自在用故轉變無礙隨心取著成外成小著邪見故成外道住真理故成小乘菩薩于諸法無住無礙言心造心變咸出大宗小乘有言而無其理然諸乘中其名雖同義亦少別有共造依報各造正報有共造正報各造依報衆生迷故或謂自然松直棘曲鶴白烏黑皆是自爾梵天等造造已或云情與無情皆最邪因無因如震旦云陰陽等造亦不由自然無因造名猶通通混內外下出正因應云心變心變復通應云體具以無始來心體本遍故佛體遍由生性遍遍有二種一寬廣遍二即狹遍所以造通于四變義唯二即是唯圓及別後位圓人始末知理不二心外無境誰情無情故藏通造六別圓造十此十及六括大小教由觀解異故十與六各分二別藏見六實通見無生別見前後生滅圓見事理一念具足實相法爾具足諸法諸法法爾性本無生故雖三千有而不有共而不雜離亦不分雖一一遍亦無所在若達唯心了體具者焉有異同何疑有無故知一塵一心即一切生佛心性何獨自心之有無邪以其造故以共變故同化境故同化事故世不知教之權實執小道而抗大道者其猶螳蜋乎井蛙乎應知萬法是真如由不變故真如是萬法以隨緣故心造法界圖智者大師云凡界內界外一切陰入皆從心起佛告比丘一法攝一切法所謂心是論云一切世間中但有名與色若欲如實觀但當觀名色心及相應數法皆無質但有名身形質礙曰色若開名為四受想行識即五陰華嚴云心如工畫師造種種五陰即十法界五陰一切世間中莫不從心造三種世間皆從心起十法界者三義十數是能依法界是所依能所合稱故言十法界又此十法各各因各各果不相混濫故又此十法一一當體皆是法界故十法界通稱陰入界者以皆有陰入界故佛有涅槃常住陰界入大經云因滅無常色獲得常色受想行識亦復如是常樂重沓積聚義慈悲蓋覆即陰義以十種陰界不同故名五陰世間攬五陰通稱衆生乃至佛攬常住陰為尊極衆生大論云衆生無上者佛是十號中為無上士豈與凡下同以十界衆生不同故名衆生世間十種所居通稱國土者地獄依赤鐵住畜生依地水空住修羅依海畔海底住人依地住天依宮殿住六度菩薩同人依地住通教菩薩惑未盡同人天依住斷惑盡者依方便土住同二乘處別圓菩薩惑未盡者同人天方便等住斷惑盡者依實報土住如來依常寂光土住仁王經云三賢十聖住果報唯佛一人居淨土土土不同故名國土世間也此三十種世間悉從心造無明法法性生一切法如眠法覆心則有一切夢事心與緣合則三種世間三千性相皆從心起若達無明即法性一切心一心如彼醒寤若法性無明合有一切法陰界入等即是俗諦一切界入是一法界即是真諦非一非一切即是中道第一義諦如是遍歷一切法無非不思議三諦若一法一切法即假觀一切法一法即空觀非一非一切即中道觀若一空一切空無假中而不空總空觀也一假一切假無空中而不假總假觀也一中一切中無空假而不中總一念具三千圖一心具十法界一法界又具十法界成百法界一法界具三十種世間百法界即具三千種世間此三千在一念心若無心則已介爾有心即具三千亦不言一心在前一切法在後亦不言一切法在前一心在後秪心是一切法一切法是心不前不後非縱非橫非一非異非識所識非言所言故稱為不可思議境此是天台圓教觀心之要具摩訶止觀法界直指圖四聖六凡依報正報皆依一真法界而起業用如虗空包含萬象大海涌現千波又如明鏡現衆色像夫一真法界明鏡之體也聖凡依正鏡中之影像也雖影像似有而性常自空鏡體雖空而能現影像是以空有無礙真俗變融以體寂故名理法界以相用故名事法界以即理之事名理事無礙法界以事事即理名事事無礙法界此四法界舉一全收互攝互融凡舉一塵一毛皆具足諸法中觀也即不可思議一心三觀歷一切法亦如是如四大色能造大地土石草木種種人類種種禽獸如如意珠能雨淨妙五欲七寶琳琅色法尚爾況心神靈妙寧不具一切法邪永明智覺禪師云夫善惡二輪苦樂二報皆三業所造四緣所生六因所成五果所攝若一念心瞋恚邪淫即地獄業慳貪不施即餓鬼業愚癡暗蔽即畜生業我慢貢高即修羅業堅持五戒即人業精修十善即天業證悟人空即聲聞業知緣性離即緣覺業六度齊修即菩薩業真慈平等即佛業若心淨即香臺寶樹淨剎化生心垢則丘陵坑坎穢土稟質皆是等倫之果能感增上之緣離自心源更無別體泰和曾居士曰將明法界之性先示業用之相回萬慮于體中判千途于一念故見見聞聞不可得而略也夫六合之間奇偉靈變何所不有良以斯人弱喪封錮實深心窮于耳耳奪于目亥步所經已不能曉形物之表益復昧然若不解其桎梏除其盲聾則窮心猶鄙寧承長者之家局智長驚誰破肩吾之夜今斯圖出使人知大象若斯前聞實狹然後蕩𮌎遣纍豁視開聽即事明理達境惟心如其世智限心幽途廢照亦將謂幅圓窮于天地事業極于百齡一途既謬萬岐橫生見網綢繆長夜方永故當依聖建言編經顯義暢法界之無窮以廣其心明道妙之過量以變其志庶幾局步可展先心可革拔鍥出釘將在斯矣
