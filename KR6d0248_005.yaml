body:
  text: 燕山沙門仁潮集四大千劫量千世界圖說大千攝禪大千積數劫量總名成劫住劫壞劫空劫大劫圖說增減劫圖說四輪王小三災大三災劫運圖說賢劫千佛圖說紀劫年數前來雖觀三界但豎明其高未及于廣故次明大千周知八方有無窮三界可窮佛剎之廣也千世界圖大千世界說華嚴經云三千大千世界以無量因緣乃成大地依于水輪水依于風風依于空空無所依衆生業感世界安住菩薩藏經云諸佛成就不思議智故能知諸風雨相知世有大風名烏盧博迦衆生諸有覺受皆因此風之所動搖此風輪高三拘盧舍此云一鼓聲間雜藏五里為拘盧舍于此風上虗空之中復有風輪名瞻薄迦此風輪量高十由旬如是次第八千風輪之相悉能了知最上風輪名周遍上界為水輪之所依止其水量高八十百千由旬為大地之所依止其地量高六十八千由旬是地量表有一三千大千世界長阿含云一日月周行四天下光明所照是為一世界如是千世界中有千日月千須彌山王四千天下四千大海四千惡道千閻羅王千四天王千忉利天至千梵天是為小千世界爾所小千千世界是為中千世界爾所中千千世界是為大千世界其中須彌四洲日月乃至梵天各有萬億通名一佛剎也俱舍云四洲日月迷盧欲天梵世各一千名一小千界此小千千倍說名一中千此中千千倍名一大千皆同一成壞雜阿含經順正理論瑜伽論智論雜集顯揚論大千數皆同上金光明云是諸人王手擎香罏供養經時其香遍布于一念頃遍至三千大千世界百億日月乃至百億非非想天華嚴云爾時世尊從兩足輪下放百億光明照此三千大千世界百億四洲百億大海輪圍山百億須彌六欲乃至百億色究竟天其中所有悉皆明現華嚴鈔云若說小千但數初禪若數中千即數二禪以二禪量等中千故若數大千即數三禪三禪量等大千故是知大千有百億初禪有百萬二禪一千三禪唯一四禪耳媻沙論云初禪廣如四天下二禪如小千三禪如中千四禪如大千據此則前鈔應云二禪量等小千三禪量等中千為是述論曰佛之聖言理應無二云何經論互有不同須彌之數若依阿含俱舍等大千則有萬億須彌若光明華嚴等則有百億須彌此數不同也又或言大千有百億四禪則量最狹或言惟一四禪其量最廣此廣狹之不同也又或言有四空天或無四空天此增減之不同者何邪曰雖有少異各有理焉一會數者先以諭顯一小千界如一貫錢一文如一須彌山千文如千須彌等一中千界如千貫錢大千界如千千貫雖數之大小不同皆不出此千千貫何者以億有四等故若以十萬為億則大千有萬億須彌若百萬為億則大千有千億須彌若千萬為億則大千有百億須彌若以萬萬為億則大千有十億須彌也以此會之或百或萬無不可者總不出此大千之境矣二會廣狹者且如二禪量等小千以小千初禪向上取之則有千二禪如是百億初禪向上取之則有百億四禪譬如夏雲普覆九州若以州取則有九雲若以郡取則四百餘雲若以縣取千數未多或言一雲普覆萬國或言萬國各有夏雲思之可見三天數增減者有二義若以金光楞嚴等則色界上有四空天若華嚴約有處所但至色頂約該地法遍于四空四空無處隨處得果如在欲界得無色定即于欲界而受果報故無別處攝在二界故阿毗曇云從此須彌頂邊至彼須彌頂邊十二億三千四百五十由旬從此須彌中心至彼中心十二億八萬三千四百五十由旬從此山根至彼山根十二億三千十五由旬其八方山山相遠亦復如是此佛所說或云千須彌外有一小輪圍山外繞高至初禪中千界外有中輪圍山外繞高至二禪大千界外有大輪圍山外繞高至三禪又一須彌四天下外有一小輪圍山共成四等總大輪圍山內所包上至非想下極風輪統名三千大千世界以三度積故曰三千略去小中舉其末後故云大千斯大千界成則同成壞則同壞通號娑媻世界乃釋迦如來攝化之境也大千攝禪之圖大千增數之圖一世界一日月之所照臨也此方黃帝算法增數十世界十日月十百世界百日月百十十小千千世界一小千千十百十千界十小千萬十千億數有四等百千界百小千億十萬此億大千則有萬億須彌中千千千界千小千為一中千兆十億亦百萬此為億大千有千億須彌十千千十中千京十兆亦千萬此為億大千有百億須彌百千千百中千姟十京亦萬萬此為億大千有十億須彌大千千千千千中千為一大千秭十姟亦億萬劫量總名劫者是大時之總名也梵語具云劫波簸陀略云劫此云大時分然此大時甚為久遠不可以歲月而計故聖人假拂石芥城指水火成壞等際以給其候焉劫有多種略可知者大小成壞耳初約四等一別劫一增減二成劫四十以住合成三壞劫四十以空合壞四大劫總成壞別劫若更舒之則有六劫一別二成三住四壞五空六大若更束之則為三劫一小劫即別劫二中劫成住隨一三大劫總成住壞空開闔雖異總不出于一大時分也成劫成劫者謂過去世界既磨滅已空曠久時衆生業力復起風雨依舊造立諸器世界也依華嚴經云三千大千世界非以一緣非以一事而得成就以無量緣無量事而得成就所謂興布大雲降澍大雨四種風輪相續為依其四者何一者能持能持大水故二者能消能消大水故三名建立建立一切諸處所故四名莊嚴莊嚴分布咸善巧故如是皆由衆生共業及諸菩薩善根所起令于其中一切衆生各隨所宜而得受用又大雲降雨之時有大雲雨名為能滅能滅火災有大雲雨名為能起能起大水有大雲雨名為能止能止大水有大雲雨名為能成能成一切摩尼諸寶有大雲雨名為分別分別三千大千世界三千大千世界初始成時先成色界諸天宮殿次成欲界諸天宮殿次成于人及餘衆生之所住處又如大雲雨一味水隨諸衆生善根異故所起宮殿種種不同世界初欲成時有大水生遍滿三千大千世界生大蓮華名如來出現功德寶莊嚴遍覆水上光照十方一切世界時摩醯首羅淨居天等見是華已即決定知于此劫中有爾所佛出興于世爾時其中有風輪起名善淨光明能成色界諸天宮殿有風輪起名淨光明莊嚴能成欲界諸天宮殿有風輪起名堅密無能壞能成大小諸輪圍山及金剛山有風輪起名勝高能成須彌山王有風輪起名不動能成十大山王何等為十所謂佉陀羅山仙人山伏魔山大伏魔山持雙山尼民陀羅山目真鄰陀山摩訶目真鄰陀山香山雪山有風輪起名為安住能成大地有風輪起名為莊嚴能成地天宮殿龍宮殿乾闥婆宮殿有風輪起名無盡藏能成三千大千世界一切大海有風輪起名普光明藏能成三千大千世界諸摩尼寶有風輪起名堅固根能成一切諸如意樹其大雲所雨一味之水無有分別以衆生善根不同故風輪不同風輪差別世界差別起世經云云何世界壞已復成謂過去世界磨滅之後經無量時起大重雲遍覆梵天澍大洪雨滴如車軸經歷百千萬年彼雨水聚漸漸增長乃至梵天世界大水遍滿四風所持雨止之後水還自退無量萬億由旬有大風起名阿那毗羅吹彼水聚波濤涌沸生大聚沫吹置空中從上造作梵天宮殿他化天宮云云復造須彌山王四洲輪圍山等依舊建立造化天地自此始也若世界成時先自上成色界三禪天次第成下至欲界𦦨摩天此依空居者故自上而成下也其次先自下風輪次第成上至忉利天此依地界故自下而成上也如是風水鼓舞變化經二十劫諸器世界方得成就住劫住劫者謂世界已成能令有情安住受用也華嚴經云三千大千世界既成就已饒益無量種種衆生所謂水族衆生得水饒益陸地衆生得地饒益宮殿衆生得宮殿饒益虗空衆生得空饒益長阿含經云天地更始了無所有亦無日月地涌甘泉亦名地味味如酥蜜時光音諸天或有福盡來生人生之始或樂觀新地性多輕躁以指嘗之飲食之始如是三轉得其甜味食之不已漸生粗肥失天妙色神足光明冥然大暗後大黑風吹彼海水漂出日月日月之始繞須彌山照四天下時人見出則歡見入則懼晝夜之始自茲以後晝夜晦朔春秋歲數終而復始劫初成時人皆化生無有男女尊卑衆共生世故名衆生衆生名始食地味多者顏色粗悴其食少者顏色光澤好醜始也遂生勝負便生是非起不善始地味稍竭咸皆懊惱咄哉為禍無復地味又生地皮狀如薄餅地皮又滅又生地膚地膚滅故增一云又生自然地肥如蒲桃酒樓炭經云地肥不生便生兩枝蒲桃即林藤也其味亦甘久久食多共相形笑蒲桃不生更生粇米無有糠糩不加調和備衆美味衆生食之生男女形有根之始正理論云更生自然非種香稻此食粗故殘穢在身為欲蠲除便生二道遂男女根生由根形故欲習便起增一經云時諸人欲多者便成女人故有夫妻之名夫婦之始其後衆生淫欲轉增遂夫妻共住後光音天下生母胎中胎生之始故有胎生爾時造立城郭自然粇米朝刈暮熟暮刈朝熟中阿含云米長四寸未有莖𠏉時有衆生併取日糧如是相效乃至併取五日粇米漸生糠糩刈已不生遂有枯株爾時衆生懊惱悲泣各封田宅粇米以為疆畔田地始也其衆自藏己米盜他田穀無能決者議立一平等主善護人民賞善罰惡各共減割以供給之故選一人形貌尊雅甚有才德請彼為主田主之始如今王也于是始有民主之名奉行十善哀念人民如父母愛子人民敬主如子敬父人壽長久豐樂無極阿含云世界初成光音天人下來各有身光飛行自在見有地肥極為香美取食多者即失神足體重無光日月始生因貪食故地肥滅沒復生婆羅婆羅滅沒復生粳米長四寸許朝割暮生食彼米故方分男形女相行不淨行彼便作家于中懶惰衆生便作是念多取粳米為一日食乃至積聚漸至七日米隨所割暮不復生祐律師云澆風既動則淳源斯謝精靈通感則霆擊為遲東萊加租而海魚潛泳合浦增賦而璣蚌遠移以近方古不生粇米未足異疑因此造作田種立以標榜于是有一衆生而入他田竊取他稻便相拳鬬衆生舉一智者三摩多為守田主若可訶者當令彼訶我曹所得稻穀當以輸送是田主謂之剎利種其有捨家入山求道遠離惡法謂婆羅門種習業自營謂之居士種習諸伎藝以為生活謂之首陀羅種或毗舍是四種中有人思惟世間恩愛汙穢不淨何足貪著所以捨家剃除鬚髮法服求道我是沙門述曰沙門之號自上古有之蓋以欲為苦本家是著根著深故諸惡竝起欲滋故生死無窮是以上古之開士自悟知非頓捨恩愛以杜其苦源復捨家著以斷其惡因臂之出籠之鳥離雲之月出塵之道此實先焉此住劫中天地不壞衆生安住亦經二十小劫每一小劫增極時有輪王出世減極時有一小三災詳後壞劫壞劫者謂住劫已滿世界萬物盡皆壞滅也華嚴經云三千大千世界劫火起時焚燒一切草木叢林乃至鐵圍大鐵圍山皆悉熾然無有遺餘又風災起時有大風起名曰散壞能壞三千大千世界鐵圍山等皆成碎末復有大風名為能障周匝三千大千世界障散壞風不令得至餘方世界若令無此能障大風十方世界無不壞盡顯宗論云言壞劫者謂地獄有情不復生至外器界盡壞有二種一趣壞二界壞趣壞者謂此世間過于二十小劫已從此復有等住二十壞劫壞劫將起住此洲人壽量八萬是時地獄有情命終無復新生為壞劫始乃至地獄無一有情爾時名為地獄已壞諸有地獄定受業者業力引置他方地獄中由此准知傍生鬼趣時人身內無有諸蟲與佛身同傍生壞故有二說于人益者壞與人俱餘者先壞是時人趣此洲一人無師法然得初靜慮唱如是言離生喜樂甚樂甚靜餘人聞已皆入靜慮命終竝生梵世乃至此洲有情都盡是名贍部洲人已壞東西二洲例此北洲命盡生欲界天由彼鈍根無離欲故生欲天已靜慮現前轉得勝依方能離欲乃至人趣無一有情名為人趣已壞是時欲界隨一有情無師法然得初靜慮竝生梵世乃至欲界無一有情名為欲界已壞是時梵世隨一有情無師法然得二靜慮唱如是言定生喜樂甚樂甚靜餘天聞已皆入彼靜慮命終竝生極光靜天乃至梵世有情都盡上至壞到三禪准此可知惟器世界空曠而住大災將起方始界壞界壞者謂火水風災壞器世界也一火劫其俱生火起壞至二禪天二水劫其俱生水起壞至三禪天三風劫其俱生風起壞至四禪天而四禪天不壞為捨念清淨故此大三災劫但壞器世界不壞有情而有情徙于別界或有禪願及三摩提力者得生四禪天中也顯宗論云下三禪天定遭水火風災初靜慮尋伺為內災能燒惱心外火災故第二靜慮喜受為內災輕安潤澤外水災故第三靜慮動息為內災外風災故初靜慮內具三災外亦遭于三災所壞第二靜慮內有二災外亦二災所壞第三靜慮內惟一災外亦一災所壞第四靜慮無有外災以彼定中內無災患故雜心論問何故壞劫不至第四禪答淨居天故彼無上地生即彼般涅槃故亦不下生下地非數滅故若彼住經壞劫者亦不然增上福力生彼處故內擾亂非故若彼地內有擾亂者則外有災患彼初禪內有覺觀火擾亂故外為火災燒第二禪內有喜水擾亂故外為水災所漂第三禪內有出入息風擾亂故外為風災所壞問第四禪未曾有擾亂者何得不常答剎那無常所壞故第四禪地不定相續隨彼天生宮殿俱起若天命終彼亦俱沒耳凡住劫盡必經一火災壞界亦經二十小劫方壞得盡其水風劫如後明之空劫空劫者謂經大災之後天地萬物皆悉無形廓然空洞而已如是空空亦經二十小劫過此劫已復入成劫如前劫風鼓揚劫水水生厚沫化作未來山海世界依舊建立也大劫成壞循環之圖總前四種共為一大劫此大劫成壞循環源源不已凡十方三世所有一切世界皆具此四種劫相謂成住壞空成而即住住而續壞壞而復空空而又成連環無盡譬如浮橋用草年方造得成又草年跨水度人又草年漸漸壞盡又草年無橋唯水水論空劫又一大劫如一大年四中劫如四季成如春住如夏壞如秋空如冬冬而復春對法論云如是東方無間無斷無量世界或有將壞或有將成或有正壞或壞已空或有正成或成已住如于東方乃至十方亦爾如是若有情世間若器世間業煩惱力所生故業煩惱增上所起故華嚴云譬如林中葉有生亦有落如是剎種中世界有成壞莊椿録云觀夫世界成壞無窮有二因緣一由衆生同業所感謂同迷一心三毒惑業感現依報惑業未盡依報何窮若無所依何名受報故令世界成壞連續二由諸佛願力所感謂佛有弘誓盡度衆生衆生既無窮佛願亦無盡由是所感依報連續小劫增減循環之圖凡一大劫中有一往劫一住劫中有二十小劫小劫者一增一減也增減約人壽以明減劫從右上漸次減下至十歲壽數增減依中阿含經增劫從左下漸次增上至八萬以白喻善以黑喻惡解曰經名增減劫者皆就善以明義謂增者由善業增長故福增壽增等乃至十善具足時人壽八萬歲為增劫之極也如月一日二日漸漸增明至十五日月光明圓滿黑月消盡減者由善業損減故福減壽減等乃至十善消盡時人壽十歲為減劫之極也如月十六十七漸漸明少至三十日夜白月消盡唯黑月在此皆以善增善減立增減之名也若增至八萬歲時七寶顯現五味甘美百福咸集人神和悅風雨以時香稻甘泉世皆善人輪王出世豐樂無極若減人壽至十歲時七寶隱沒五味苦澀百衰競集人窮物苦鬼哭神號陰陽乖沴風雨失時饑荒疫癘殘忍相戕愚癡斃惡微有人形衰極于此所謂積善降祥積惡降殃詎不信夫前約善明增減次互明之謂善之增即惡之減善之減即惡之增若善一則惡九善二則惡八至善九則惡一善十則無惡也是為增極亦是惡之減極如惡一則善九惡二則善八至惡九則善一惡十則無善也是為減極亦是惡之增極猶如陽長則陰消陰長則陽消良以人心之善惡互為消長故感報緣苦樂低昂有增減之相耳故知因果歷然感應無差如是增減一周是名一小劫循環經二十周名一住劫或問曰此增減圖像壽數與義易卦氣全同易乃陰陽遞為消長至陽極則陰生陰極則陽生循環不已蓋氣數之勢必然者也若爾善惡遞為消長者則是善極必惡生惡極必善生邪亦可善惡互為其因邪互為其因是為邪因邪因則因果俱非其因果歷然者果安在哉答非善從惡生亦非惡從善生夫以劫末之人苦極思樂物窮知返良心斯現改惡為善故罪滅福生是反惡為善非惡極生善也若惡極不返則流入地獄豈有增福壽之理乎又增盛之時居福盈地驕奢恣縱廢善肆惡故惡卸罪來是亡善為惡非善極生惡也若善極不厭則捨人報生天宮豈有壽夭福折之理乎只可以善為增因惡為損因不可謂善為惡因惡為善因也是故增減之相與陰陽消長大同其所以增減者由心不由數也故不同邪因無因之見是以下愚者圍于數量上智者超乎數量不為物所轉也上約現劫通相而釋其別相義具諸經論其小劫增減之法云何按莊椿集云此住劫初閻浮人壽八萬四千歲身長八丈凡過百年命減一年身減一寸過千年命減十年身減一尺如是減至十歲身長一尺則減劫之極也過爾之後復入增劫凡過百年命增一年身增一寸增至千年命增十年身增一尺如是增至八萬四千歲身增八丈則增劫之極也如是一減一增共計一千六百八十萬年名一轆轤劫經二十轆轤劫方為一住劫也評曰泛常論增減一往如之今再詳則不然按莊椿總數則是也其言身長八丈為增極則非也何則人身長八丈時壽方八百歲豈增至八百而遂減邪亦安有八百歲之輪王出世哉若爾增減止得一十六萬八千年據上總數為百分之一分耳彼雖云增至八萬四千歲乃所經年數非人壽數然也若謂人壽八萬四千歲者則身長當八百四十丈而所經之年八百四十萬年矣方是增極之正數減亦如之又言至十歲身長一尺為減極則是若謂減過八萬四千年身減八丈為減極亦非也何者設減過八萬四千年所經之年人身減八丈此時人壽方減八百歲尚有八萬三千一百餘歲壽身長八百三十一丈餘此時壽非十歲身非一尺云何為減極邪更以圖明增劫從人壽十歲為始時壽身過百年增一歲增一寸過千年增十歲增一尺過萬年增百歲增一丈過十萬增千歲增十丈過百萬增萬歲增百丈過八百萬增八萬歲增八百丈又過四十萬年又加四千歲又加四十丈減劫從人壽八萬四千歲為始時壽身過百年減一歲減一寸過千年減十歲減一尺過萬年減百歲減一丈過十萬減千歲減十丈過百萬減萬歲減百丈過八百萬減八萬歲減八百丈又過三十九萬九千年又減三千九百九十歲又減三十九丈九尺唯一丈在若云過百年增一歲等當如此圖若不爾者則非過百年增一歲也俟再考增劫四輪王凡增劫中皆有四種輪王次第出世如前漸增至人壽二萬歲時鐵輪王出世王一天下奮威始定又增至人壽四萬歲時銅輪王出世王二天下威震乃伏增至人壽六萬歲時銀輪王出世王三天下遣使方伏增至人壽八萬歲時金輪王出世王四天下望威順化金輪聖王具七寶千子十善化世七寶者一金輪寶真金所成千輻具足王灌頂日飛空而至乘斯輪力王及四兵飛空而行周四天下諸粟散王仰德歸化二象寶白如雪山六牙具足三馬寶龍種所生王乘一日周四天下四玉女寶蓮華化生端正第一五主兵臣寶勇健大力智略無敵六寶藏臣寶善知伏藏諸寶任王取用七如意珠寶光照一由旬令夜如晝復隨王意雨諸珍寶王壽八萬四千歲大子相承是時七寶金銀琉璃等也出現地味浮上自生粇米四序溫和人行十善最極豐樂經久遠時具如諸經論減劫小三災凡減劫之極有小三災次第而起按毗曇論云佛說劫中世界經二十小劫壞次經二十小劫壞已空次經二十小劫空已起成次經二十小劫起成已住是住劫中間有小三災次第輪轉一疾疫災二刀兵災三饑饉災第一劫小災起時有大疾疫諸病閻浮人民壽促唯十歲身矬二三搩手稗為上味髮服第一是人不行正法邪見增長惡鬼損人國王皆亡國土空廢唯小郡縣相去遼遠病苦無療一日一夜疫死無量由行惡法得是果報生此劫濁時郡縣荒蕪唯少家在相去轉遠無人送埋白骨遍地劫末七日衆在遭疫死盡唯有萬人能持善行善神擁護不令斷絶七日過大疫息滅惡鬼散去爾乃陰陽調和美味出生衆生相見猶如親友共相愛樂不捨善法增長善增為增劫之因也壽漸增至二十千歲久久增至八十千歲時女五百歲乃行嫁娶國土豐樂村落次比衣服財寶稱意具足經阿僧祇年此增極之時也乃至衆生未起十惡從起十惡起惡為減因也壽命漸減至壽十歲減之極也刀兵者人壽十歲時三毒邪見日夜增長父子兄弟互相鬬諍何況他人以瓦石刀杖互相怖畏四方諸國互相伐討害死無量不善果報生此劫濁人家沒盡殘餘分散劫末七日手執草木即成刀杖互相殘害是時諸人怖懼刀杖逃竄山林孤洲坑窟以避災難或時相見仍各驚走譬如獐鹿遭逢獵師七日刀兵橫死無量唯萬人在以為人種如前過七日後刀兵息滅陰陽調和衆生相見喜愛如親友從十歲展轉行善壽增二十千乃至八十千歲住阿僧祇年同前饑饉者時人壽十歲所食稊稗人髮為衣貧窮困苦愚癡邪見日夜增長穀貴饑饉見他資糧便往奪食以此因緣餓死無數作惡業故四五年不雨由大旱故覔生草菜尚不可得何況米穀一日一夜饑死無數郡縣空盡唯少家在三毒轉盛時六七年不雨大旱思欲見水尚不可得何況飲食劫末七日餓死殆盡唯餘萬人如前乃至壽增八十千歲瑜伽論云三種小災出現謂儉病刀儉災者人壽三十歲時方始建立當爾之時精妙飲食不可復得唯煎朽骨共為宴會若遇一粒稻麥粟稗等子重若摩尼藏置箱篋而守護之由此饑儉有情之類亡歿殆盡此之儉災經七年七月七日方乃得過彼諸有情起下品厭離由此因緣壽不退減儉災遂息至于人壽二十歲時本起厭患今乃退捨爾時多有疫氣相續而生彼諸有情悉多殞沒如是病災經七月七日方乃得過彼諸有情起中厭離由此因緣壽量無減病災乃息又至人壽十歲時本起厭患今復退捨爾時有情展轉相見各起猛利殺害之心由此因緣隨執草木及以瓦石皆成刀劒更相殘害經一七日方乃得過復有三種最極衰損一壽量衰損謂壽極至十歲二依止衰損謂其身量極至一搩或復一握三資具衰損唯以粟稗為食中第一以髮褐為衣中第一以鐵為莊嚴中第一五種上味悉皆隱沒謂蘇蜜甘蔗油鹽咸變其味爾時有情展轉聚集起上厭離不復退減又能棄捨損減壽量惡不善法受行增長壽量善法由此因緣壽量色力富樂自在皆漸增長至八萬歲中阿含經云八萬歲時人初起惡盜他人物因盜滋故壽形轉減父壽八萬歲子壽四萬其時衆生增殺業故壽損二萬復增妄語兩舌故壽損一萬更增嫉妒邪淫乃至非法欲惡邪貪兩舌綺語邪見不孝父母不敬沙門不作福業不見後世罪故壽命轉減五千二千一千五百二百一百乃至人壽十歲女生五月即便出嫁稗為上味甘美盡沒唯行十惡者為人所敬人民互有害心刀兵劫起與毗曇同亦有慚愧厭惡之人便入山野隱藏刀兵劫過後從山野出相見更互慈心愛念如親友作是言我等由生不善心令親族死盡我等寧可共行善法離殺害業行善已壽便增長十歲生子壽二十歲復作是念若行善者壽色轉好我等應可更增行善離不與取遂壽增四十復離邪淫妄語乃至兩舌粗言綺語貪嫉瞋恚邪見非法欲惡邪貪不善法行故壽命增八十百六十三百六百二千五千一萬二萬四萬八萬歲時孝順父母恭敬沙門修諸福業此閻浮洲極大豐樂女五百歲乃當出嫁輪王治世人民安樂云云疾疫饑饉延促同前新婆沙論云若有能一日一夜持不殺戒于未來世決定不逢刀兵災起若能以一訶梨果起殷淨心奉施僧衆于當來世決定不逢疾病災起若能以一團食施諸有情于未來世決定不逢饑饉災時述曰觀夫劫數之增減人壽之延促國土之豐儉受用之苦樂皆係乎業業之善惡職由乎人心以人心淳浮相侵善惡相滋故劫之增減壽之延促亦隨之于後也信乎善惡之報影響相從苦樂之徵由來相易矣是故我輩今稟最靈宜應止息十惡勤行十善而世世果報禎祥嘉慶者豈不逍遙怡樂有餘裕哉大三災相凡諸器世界成久必壞有三種大災隨時而起一火災者謂一大劫中住劫過已則有一火災壞其世界其相云何依因本經云大三災時有大黑風吹使海水兩披取日宮殿置須彌山半安日道中緣此世間有二日出河渠流竭其後久久大風復取第三日出大恆河竭四日出阿耨池竭五日出大海乾枯六日出大地煙起七日出山地洞然長阿含雜心論皆同觀佛三昧經大同直至梵天乃至三千大千剎土靡不燒滅六欲諸天皆悉命終須彌山崩洞然烈焰至于梵天梵天捨命生光音天以下盡成灰墨新生天子未曾見此普懷恐怖舊生天子各來慰勞勿生恐怖終不至此謂火災壞止初禪不至二禪以無火業故然二禪鄰于初禪故火壞初禪光照二禪二禪新天乍見不達遂生恐怖舊天見慣故來安慰耳火災之後劫欲成時布大黑雲周遍降雨滴如車軸無數千歲大千剎土水遍其中及至梵天其水漸長至光音天此成劫之水也此水復減有大風起鼓動波濤起沫積聚自然堅固變成天宮七寶校飾由此有梵天宮其水轉減依前聚沫次第成就他化天宮直至成四天下依前建立此明世界復成之相成已又住住已又壞如是次第經七火災而後水災方起二水災者如壞趣中衆生皆生三禪已是時雨沸灰水災從上光音宮殿隨水消滅至下欲天皆悉無形水災之後有大雲雨復作世界事同火災如是次第經七水災之後風災方起三風災者謂衆生皆生四禪已風災隨起因本云水災之後其次久久大僧伽風至果實天其風四布吹諸天宮使諸宮宮相拍碎若粉塵直至天下諸大山王相拍亦然地下水盡水下風盡其後還復而降大雨至果實天風鼓波濤起沫積聚如前水災仍舊建立三災經劫圖凡三災壞劫經時甚為久遠非同時起謂一大劫後有一火災七火後遭一水災如是久久方一風災大三災劫運始終共經六十四大劫為一周之數毗曇論偈云七火次第後然後一水災七七火七水復七火後風此總括三災次第數次釋順正理論云此水火風三大災起逼有情類令捨下地集上天中初火災興由七日現次水災興由降瀑雨後風災興由風相擊三災起時云何次第要先無間起七火災其次定應一水災起此後無間復七火災度七火災還有一水如是乃至滿七水災復有七火後一風災起如是總有八七火災一七水災一風災起水風災起皆次火災自水風災必火災起故三災次第其理應然何緣七火方一水災極光靜天即光音天壽勢故謂彼壽量極八大劫故至第八方一水災由此應知要度七水八七火後乃一風災由遍淨天壽勢力故謂彼壽量六十四劫故第八八方一風災如諸有情修定漸勝所感異熟身壽漸長由是所居亦漸長久如四禪廣果壽五百劫空處二萬劫乃至非非想八萬劫其依報亦漸廣經劫亦久蓋業力不可思議非世可知衆生自無始來業報連環所經劫數無量無邊何止千萬劫而已哉故佛說遠因則以剎塵數論之非六通大聖其誰與于此三大劫佛興之圖三大劫中三千佛出莊嚴劫已過去星宿劫猶未來賢劫乃現在有千佛出化于世今據賢劫且約四時謂成住壞空也然成劫已往壞空未至今在住劫而住劫之中有二十小劫此二十小劫中次第佛出娑婆世界自入住劫已經八減八增八小劫也無佛出世今當第九減劫有四佛出世初減人壽至六萬歲時拘留孫佛出世次減人壽四萬歲時俱那含牟尼佛出世次減人壽二萬歲時迦葉波佛出世次減人壽至一百歲時釋迦牟尼佛出世從住劫初至釋迦世尊已得一萬四千二百七十九萬三千年故法數偈曰娑婆住劫歲流遷九減仍聞八度添一萬四千零二百七十九萬三千年又自釋迦世尊滅至宋紹興已二千一百年新算自宋高宗紹興元年至我朝萬曆丙午又四百七十六年人又減二十一年身減二尺一寸今人只可六尺壽八十歲減至人壽八十身當八尺言只六尺未必然也蓋尺有古今長短不同宋尺比周尺長三寸四分當依周尺正合八尺為準耳此去更過七千年人壽十歲身長一尺至此減劫之極也遇小三災過爾之後復入第九增劫從人壽十歲如前過百年命增一歲身增一寸如是漸增乃至壽八萬歲金輪王出至此增劫之極也凡增劫中有四輪王出世次後復入第十減劫減至八萬歲時彌勒佛下生從紹興去至彌勒更經八百八十萬七千年是時百億閻浮真金為地地平如掌粳稻自生思衣衣來想食食至無量快樂男女五百歲乃方婚嫁彌勒初會度人九十二億爾後度人無數佛身長三十二丈人民長十六丈彌勒住世六萬歲說法度生涅槃後正法像法亦如是賢愚經佛言彌勒三會度人悉我遺法種福衆生然後乃化同緣之徒彌勒滅後漸減至人壽十歲十減劫極復入第十增劫十一劫至十四劫無佛出世第十五劫中有九百九十四佛出興于世十六劫至十九劫亦無佛出至第二十劫最後樓至佛出化于世涅槃後千佛出盡二十轆轤劫滿已則壞劫時至遇大三災久久復成造未來星宿劫之天地也亦有千佛出世故三千佛總括偈云莊嚴華光毗舍浮過去千佛舉其初後賢劫俱留樓至佛現在千佛舉其初後星宿日光須彌相未來千佛舉其初後如是諸佛度衆生紀劫年數按莊椿集計劫經年之數一小劫亦名別劫亦名轆轤劫謂一減一增也總此增減共計一千六百八十萬年如前算凡過百年減一歲從八萬四千減至十歲凡經八萬四千箇一百年是為八百四十萬年其增積年數同減增減合故得一千六百八十萬年也名一轆轤劫二十增減數亦如之二中劫即住劫等四也謂二十轆轤劫也總此二十增減共計三萬三千六百萬年亦是二十箇一千六百八十萬年也名為一住劫一中劫也壞空成三劫數亦如之三大劫謂四中劫也總四中劫亦是八十小劫共計一十三萬四千四百萬年亦是四箇三萬三千六百萬年名為一大劫也是為天地成壞始終之極數周而復始運運無窮焉觀夫虗空無量故世界無邊大化無窮故劫運無已其大劫者在大化之中其猶一年也成住壞空者四季也八十增減者二十四氣也四輪王者孟夏之麟鳳也三災人者嚴霜中秋蟲也矧茲瑣瑣含生營營來去者等彼器中蚊蚋紛紛狂閙耳一化而生再化而死化海漂蕩竟何所之夢中復夢長夜冥冥執虗為實曾無覺日不有出世之大覺大聖其孰與而覺之歟或問按邵子經世一元消長之數則一十二萬九千六百年是為天地始終之極數也較前大劫則為萬分之一何多少太不侔邪然世無二理何者為是答天地成壞之大數唯六通聖神者所能知見豈世俗小智之可測哉世人只可言世間事過之則出世法也曰一元之數豈非邪曰數易理也邵子一元之數理則然矣言開物閉物者比擬也如今一歲之運有箇否泰逆推而上之則一元所統一十二萬九千六百年中亦有箇否泰而運氣與年相類故曰開物于寅閉物于戌猶驚蟄啓物霜降殺物理或然也以為一大運否泰之數則然若以天地成壞亦如其數未必然也果如彼數至寅會中方有人經八會人至戌會後則人俱無天地隨壞矣戌後天地果壞乎若壞則彌勒佛等當生何處按前見在天地中有千佛出世天地既壞無地可生寅前果無人乎無人則輪王是誰寅後生人則輪王應在輪王壽八萬歲故今應在是則數或有盛衰如前增減劫而天地豈依人算數亦可壞邪
