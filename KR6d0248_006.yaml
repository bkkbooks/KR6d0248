body:
  text: 燕山沙門仁潮集五遊諸佛剎十方佛剎圖說東方淨土西方淨土圖文十一七寶嚴地七寶宮宇蓮華浴池行樹樂音寶網舒光頂光遠照化禽演法壽命長遠往生正因疑城示謫淨土正報總說一浮幢佛剎圖十浮幢佛剎圖百浮幢佛剎圖華藏業因說釋華藏名釋總題遊諸佛剎者謂深心信解諸佛剎土神智遍觀也蓋知有人天不知有佛者凡俗也信佛為出世大聖者道器也然信一佛其福雖勝見量猶局信多佛則其福量無邊其智量益廣十方佛剎圖大千世界為一佛剎如是娑婆之外太虗空中復有十方大千諸佛剎土何以知然依華嚴經云此娑婆世界東次有世界名為密訓次南有世界名豐溢次西有世界名離垢次北有世界名豐樂次東北有世界名攝取次東南有世界名饒益次西南有世界名鮮少次西北有世界名歡喜次下方有世界名關𨷲次上方有世界名振音此十方世界如來各有百億萬名號令諸衆生各別知見乃至十方無數世界亦復如是一四天下佛有十千名號大千有百億四天下故有百億萬名號十方大千亦如是東方淨土七佛功德經云東方去此過四𠓆伽河沙佛土有世界名曰無勝佛號善名稱吉祥王如來亦是寶嚴之土蓮華化生次東方過五𠓆伽沙佛土有世界名曰妙寶佛號寶月智嚴光音自在王如來次東方過六𠓆伽沙佛土有世界名曰圓滿香積佛號金色寶光妙行成就王如來次東方過七𠓆伽沙佛土有世界曰名無憂佛號無憂最勝吉祥王如來次東方過八𠓆伽沙佛土有世界名曰法幢佛號法海雷音王如來次東方過九𠓆伽沙佛土有世界名曰善住寶海佛號法海勝慧遊戲神通王如來東方去此過十𠓆伽沙佛土有世界名淨琉璃佛號藥師琉璃光王如來如是諸佛世界皆如西方極樂世界功德莊嚴等無差別兢伽或恆河此河濶四十里沙細如麵一沙計一佛剎計盡一河之沙名一恆河沙佛剎西方淨土圖西方淨土何名淨土世界皎潔目之為淨即淨所居名之為土攝論云所居之土無有五濁如頗梨等名清淨土對法論云無煩惱衆生住處名為淨土十方國土雖復清淨惟西方極樂世界最為殊勝故阿彌陀經云從是西方過十萬億佛土大本百萬有世界名為極樂彼土何故名為極樂其國衆生無有衆苦但受諸樂故名極樂大本云有自然清淨之音自然快樂之事七寶嚴地大阿彌陀經云阿彌陀佛剎中皆自然七寶所謂黃金白銀水晶琉璃珊瑚琥珀硨渠其體性溫柔以是七寶相間為地光色照曜奇妙清淨觀經云琉璃地上金繩間錯以七寶界分齊分明放種種光其光如華或如星月廓平正無須彌輪圍諸山大海及坑坎井谷亦無地獄鬼畜修羅等惟有自然流泉亦無寒暑小本云無三惡道七寶宮宇彼佛講堂精舍七寶合成復有寶樓觀欄楯小本七重欄楯寶珠瓔珞之所嚴飾殊特妙好清淨光暉菩薩聲聞所居宮宇亦然諸天世人所居宮閣隨形高下大小或一寶二寶乃至多寶所成或在地下或懸空中隨福厚薄各得受用觀經衆寶國土一一界上有五百億寶樓小本有樓閣四寶嚴飾之蓮華浴池有諸池沼或黃金為池或白銀為池或水晶琉璃為池或珊瑚琥珀為池乃至七寶為池其底沙亦如是其寶池有方四十里者五十六十里者以至方二萬四百八十里若大海者若佛浴池其方倍此衆寶合成八功德水湛然盈滿清淨香潔味如甘露有百種異華芬芳馥郁一一七寶池中有六十億七寶蓮華一一蓮華十二由旬一一寶華百千萬葉其華光明無量雜色青色青光白色白光玄黃朱紫之色其光亦然煒燁煥爛明輝日月流光化佛說清淨法行樹樂音諸寶池岸上有無數旃檀香樹吉祥果樹花果恆芳香氣流布復有七種寶樹或一寶者二寶者以至七寶為一樹者根莖枝葉各以一寶如是諸樹行行相植莖莖相望如是行列數百千重小本七重周遍世界微風吹動出妙樂音皆演妙法寶網舒光復有無量寶網彌覆其剎皆以金銀珍珠百千雜寶奇妙異珍莊嚴校飾周匝垂布光色晃曜和風吹網出妙法音或吹妙華遍處散布頂光遠照十方世界一切衆生往生彼國者皆在寶池蓮華化生自然長大無乳養者食自然食身皆金色容貌端正非世可比但光有大小佛頂光明照千萬世界小本光明無量照十方國菩薩頂光照千億萬里聲聞頂光各照七丈化禽演法有白鶴孔鸚鵡舍利迦陵頻伽共命之鳥亦演說法音皆佛神力所化小本是諸衆鳥皆阿彌陀佛欲合法音宣流變化所作壽命長遠彼佛壽命及其人民無量無邊阿僧祗劫故名阿彌陀阿僧祗此云無央數乃大劫之名也華嚴經云娑婆世界一劫極樂世界為一日一夜往生正因志心欲往生者有三輩上者捨家棄欲而作沙門心無貪慕持守經戒行六波羅蜜菩薩業專念彼佛修諸功德是人夢中見佛菩薩命終佛與聖衆悉來迎致即于彼寶池化生得為菩薩中者雖不能作沙門大修功德常信受佛語深發無上菩提之心專念彼佛隨力修善奉持齊戒起立塔像飯食沙門懸幡然燈散華燒香以此回向願生彼國命終化佛接引往生彼處功德次前下者不能作諸功德發大道心一向專念每日十氣念佛臨終夢佛亦得往生其德次于中者復有三等其次齊戒清淨一心念佛十晝夜不絶者命終必得往生又縱不能十晝夜當絶慮去憂勿近女人端身正心斷除愛欲齊戒清淨憶念佛名一日夜不絶亦得往生又若男子女人發菩提心持諸禁戒所作善緣饒益衆生憶念彼佛及剎境界命終佛迎化生淨土又云生彼佛剎必修十善小本云若一日二日至七日一心不亂即得往生疑城示謫若人修功德願生彼剎後有悔心疑惑不信彼佛剎及往生者續有念心暫信不信志意猶豫復又悔過念佛亦生彼剎在邊地七寶城中蓮花化生衣食自然受天快樂惟于城中經五百歲不見佛法及菩薩以此為苦示其小謫是故念佛之人應當諦信發願往生勿懷疑惑致斯罪責正報總說蓮宗寶鑑云因修白業果感淨方化佛引上金臺賢聖迎歸樂國高超三界逈出四流業盡塵消亡情絶慮質托蓮苞之內神遊寶界之中面奉阿彌為本師得見觀音勢至為親友清淨海衆大會寶池九品勝流各說本行五香拂體三德嚴身暫扇微風聆衆音之演法繽紛花雨覩𦦨網之舒光縹眇雲霞近浮神足輕盈衣裓盛接妙花晨謁慈顏得法印而還國暮遊金剎聽玉偈以逍遙瑞蓮初綻為遣殘殃新學化生行成不退豈惟近忘粗苦抑亦佛果非遙戲玩瓊林灌沐德水百寶之樓臺華麗七重之行樹森嚴景序長春地平如掌衣食隨念而至天樂不鼓自鳴受用出于自然快樂實非人世諸天萬億倍不可比論諸佛恆河沙悉皆稱讚身具光明妙相足踐聖道香階壽命難量悲願無盡捨兩重生死既非果趣之身獲本際常光離去來之相緣強德勝皆由念佛心生福備壽長盡是淨因感報故知佛有攝生之願生有感佛之因如是勝緣起于信願以斯妙果成就正依或禪誦七寶池邊或經行黃金地上飽禪悅法喜珍味掛慈悲喜捨天衣功德資神增加悲智雍容辦道長養聖胎入無生門便登菩薩之位得阿跋致不退菩提之心住法王家盡授如來之記聞大乘法同稱補處之尊念念虗玄心心靜慮得三昧正定具六種神通獻供十方往來無礙分身億剎不失定心灑法水于三千出衆生于火宅自他兼利行願周圓可謂百千三昧盡唯心功德莊嚴歸自己今此極樂世界以娑婆觀之即西去有十萬億佛剎之遙若以世界種觀之則極樂世界尚抂第十三重內去中間娑婆不遠以娑婆西去有佛剎微塵數世界等方至十三重極西邊際此極樂是念佛人往生之處實有七寶淨土執無淨土是邪見說一浮幢佛剎圖華嚴經云有十不可說佛剎微塵數香水海在華藏莊嚴世界海中如天帝網分布而住此最中香水海名無邊妙華光以現一切菩薩形摩尼王幢為底出大蓮華名一切香摩尼王莊嚴有世界種而住其上名普照十方熾然寶光明以一切莊嚴具為體有十不可說佛剎微塵數世界于中布列其最下方有世界名最勝光遍照佛號淨眼離垢燈佛剎微塵數世界周匝圍繞此上過佛剎微塵數世界有世界名種種香蓮華妙莊嚴佛號師子光勝照二佛剎微塵數世界周匝圍繞此上過佛剎微塵數世界有世界名一切寶莊嚴普照光佛號淨光智勝幢三佛剎微塵數世界周匝圍繞此上過佛剎微塵數世界有世界名種種光明華莊嚴佛號金剛光明無量精進力四佛剎微塵數世界周匝圍繞此上過佛剎微塵數世界有世界名普放妙華光佛號香光喜力海五佛剎微塵數世界周匝圍繞此上過佛剎微塵數世界有世界名淨妙光明佛號普光自在幢六佛剎微塵數世界周匝圍繞此上過佛剎微塵數世界有世界名衆華𦦨莊嚴佛號歡喜海功德名稱自在光七佛剎微塵數世界周匝圍繞此上過佛剎微塵數世界有世界名出生威力地佛號廣大名稱智海幢八佛剎微塵數世界周匝圍繞此上過佛剎微塵數世界有世界名出妙音聲佛號清淨月光明相無能摧伏九佛剎微塵數世界周匝圍繞此上過佛剎微塵數世界有世界名金剛幢佛號一切法海最勝王十佛剎微塵數世界周匝圍繞此上過佛剎微塵數世界有世界名恆出現帝青寶光明佛號無量功德法十一佛剎微塵數世界周匝圍繞此上過佛剎微塵數世界有世界名光明照曜佛號超釋梵十二佛剎微塵數世界周匝圍繞此上過佛剎微塵數世界有世界名娑婆其佛即是毗盧遮那十三佛剎微塵數世界周匝圍繞極樂世界在此圍繞伴剎之中此上過佛剎微塵數世界有世界名寂靜離塵光佛號遍法界勝音十四佛剎微塵數世界周匝圍繞此上過佛剎微塵數世界有世界名衆妙光明燈佛號不可摧伏力普照幢十五佛剎微塵數世界周匝圍繞此上過佛剎微塵數世界有世界名清淨光遍照佛號清淨日功德眼十六佛剎微塵數世界周匝圍繞此上過佛剎微塵數世界有世界名遍照十方佛號無礙智光明十七佛剎微塵數世界周匝圍繞此上過佛剎微塵數世界有世界名離塵佛號無量方便最勝幢十八佛剎微塵數世界周匝圍繞此上過佛剎微塵數世界有世界名清淨光普照佛號普照法界虗空光十九佛剎微塵數世界周匝圍繞此上過佛剎微塵數世界有世界名妙寶𦦨佛號福德相光明二十佛剎微塵數世界周匝圍繞此遍照十方熾然寶光明世界種有如是等不可說佛剎微塵數廣大世界各各所依住各各形狀各各體性各各方面各各趣入各各莊嚴各各分齊各各行列各各無差別各各力加持周匝莊嚴所謂十佛剎微塵數回轉形世界十佛剎微塵數江河形世界十佛剎微塵數旋流形世界十佛剎微塵數輪輞形世界十佛剎微塵數壇墠形世界十佛剎微塵數樹林形世界十佛剎微塵數樓觀形世界十佛剎微塵數尸羅幢形世界十佛剎微塵數普方形世界十佛剎微塵數胎藏形世界十佛剎微塵數蓮華形世界十佛剎微塵數佉勒迦形世界十佛剎微塵數衆生形世界十佛剎微塵數佛相形世界十佛剎微塵數圓光形世界十佛剎微塵數雲形世界十佛剎微塵數網形世界十佛剎微塵數門闥形世界如是等有不可說佛剎微塵數此一一世界各有十佛剎微塵數廣大世界周匝圍繞此諸世界一一復有如上所說微塵數世界而為眷屬如是所說一切世界皆在此無邊妙華光香水海及圍繞此海香水河中清涼疏云准標及結皆有不可說佛剎微塵數其別辨中但列十九佛剎微塵數為二十重其能繞剎但有二百一十剎塵數疏明標結多別別少補注經中但以二十箇世界為主及眷屬為二十重豈中間所過之剎獨無眷屬則八方之上下重重空缺何成安立乃知不爾故文結云如是等有若干數則知八方重重布滿齊等無異其數已具且如種中第一世界有一剎塵眷屬第二世界亦應有剎塵眷屬第三第四至于二重下經過佛剎塵數主剎皆有剎塵數伴繞即有多多剎塵數次第至二十重具有無數重其世界之數比標文最多文但標十不可說剎塵數未至恆沙剎塵故最少以二重下即有佛剎微塵數箇佛剎微塵數世界故其二重上又倍之三重上又倍之十浮幢佛剎圖此無邊妙華光香水海東次有香水海名離垢𦦨藏出大蓮華名一切香摩尼王妙莊嚴世界種名遍照剎旋二十重世界于中安住此香水海南次有香水海名無盡光明輪世界種名佛幢莊嚴此海右旋次有香水海名金剛寶𦦨光世界種名佛光莊嚴藏此海右旋次有香水海名帝青寶莊嚴世界種名光照十方此海右旋次有香水海名金剛輪莊嚴底世界種名妙間錯因陀羅網此海右旋次有香水海名蓮華因陀羅網世界種名普現十方影此海右旋次有香水海名積集寶香藏世界種名一切威德莊嚴此海右旋次有香水海名寶莊嚴世界種名普無垢此海右旋次有香水海名金剛寶聚世界種名法界行此海右旋次有香水海名天城寶堞世界種名燈𦦨光明如是十海在妙華光海外次第右旋周匝圍繞其十世界種中皆有二十重世界于中安住此華藏莊嚴世界海有須彌山微塵數風輪所持其最上風輪名殊勝威光藏能持普光摩尼莊嚴香水海此香水海有大蓮華名種種光明蕊香幢華藏莊嚴世界海住在其中四方均平清淨堅固金剛輪山周匝圍繞地海衆樹各有區別此大輪圍山內所有大地一切皆以金剛所成堅固莊嚴不可沮壞清淨平坦無有高下此大地中有十不可說佛剎微塵數香水海一切妙寶莊嚴其底妙香摩尼莊嚴其岸毗盧遮那摩尼寶王以為其網香水澄徹具衆寶色充滿其中種種寶華旋布其上旃檀細末澄垽其下云云一一香水海各有四天下微塵數香水河右旋圍繞此十不可說佛剎微塵數香水海中有十不可說佛剎微塵數世界種安住其最中香水海名無邊妙華光世界種名普照十方熾然寶光明有二十重世界于中安住如前無邊妙華光香水海次東有離垢𦦨藏等十香水海經不可說佛剎微塵數香水海至最近輪圍山香水海名頗梨地世界種名常放光明有二十重世界于中安住經文但列四重名號其離垢海次南有無盡光明輪等十香海經不可說佛剎微塵數香海至近輪山香水海名妙樹華世界種名出生諸方廣大剎亦二十重世界此無盡輪海右旋次有金剛寶焰光等十香海經不可說佛剎微塵數香海至近輪山香水海名無邊輪莊嚴世界種名無量方差別亦二十重世界此金剛光海右旋次有帝青寶莊嚴等十香海經不可說佛剎微塵數香海至近輪山香水海名樹莊嚴幢世界種名安住帝網亦二十重世界此帝青海右旋次有金剛輪莊嚴等十香海經不可說佛剎微塵數香海至近輪山香水海名經中闕此一海名世界種名經亦闕此一世界種此金剛海右旋次有蓮花因陀羅等十香海經不可說佛剎微塵數香海至近輪山香水海名密焰雲幢世界種名一切光莊嚴亦二十重世界此蓮華海右旋次有積集寶香藏等十香海經不可說佛剎微塵數香海至近輪山香水海名閻浮檀寶藏輪世界種名普音幢亦二十重世界此積集海右旋次有寶莊嚴等十香海經不可說佛剎微塵數香海至近輪山香水海名出帝青寶世界種名周遍無差別亦二十重世界此寶莊嚴海右旋次有金剛寶聚等十香海經不可說佛剎微塵數香海至近輪山香水海名不可壞海世界種名妙輪間錯蓮花場亦二十重世界此金剛寶聚香水海右旋次有天城寶堞等十香水海經不可說佛剎微塵數香水海至最近輪圍山香水海名積集瓔珞衣世界種名化現妙衣亦二十重世界如是等十不可說佛剎微塵數香水海中有十不可說佛剎微塵數世界種皆依現一切菩薩形摩尼王幢莊嚴蓮華住各各莊嚴際無有間斷各各放寶色光明各各光明雲而覆其上各各莊嚴具各各劫差別各各佛出現各各演法海各各衆生遍充滿各各十方普趣入各各一切佛神力所加持此一一世界種中一切世界依種種莊嚴住遞相接連成世界網于蓮華藏莊嚴世界海種種差別周遍建立其華藏世界海依經中具有一百一十一香水海種亦如之其諸香海名等具華藏品中華藏業因清涼疏問蓮華香海約事可爾何因剎海相狀如斯曰略舉二因一約衆生如來藏識即是香海亦法性海依無住本是謂風輪亦妄想風于此海中有因果相恆沙性德即是正因之華世出世間未來果法皆悉含攝故名為藏若以法性為海心即是華含藏亦爾然此藏識相分之中半為外器不執受故疏相分也半為內身執為自性生覺受故親相分也如來藏識何緣如此法如是故行業引故二約諸佛謂以大願風持大悲海生無邊行華合藏二利染淨果法重疊無礙故所感剎相狀如之是以出現品中多將世界以諭佛德細尋文義乃由佛德世界如之棗柏論云初因大願力任持一切報得風輪甚深大慈悲報得香海無邊大行報得蓮華又蓮華即無依智體大悲含育之宮殿智照觀根順悲濟物之樓閣平等自性法身淨戒之摩尼防護之業報得輪圍萬行利生開敷衆善報得衆華建行覆蔭之寶樹如如報業所因不可具悉夫報不虗得皆有所因若不知因云何修果以斯而觀亦可云平等荷負一切無疲厭故報得寶地以大悲隨方潤物故有諸香水海隨機普利于諸世間清淨無染故諸蓮華高出水上以諸妙德發起一切諸善根故有世界種又以尸波羅蜜為之寶垣摧邪建正為之寶幢覆以寶網報細智交絡也懸以寶鐸表法音攝召也嚴之衆寶酬檀那之德也興之供雲答精進之恩也加以破暗之光明普熏之香草三昧遊戲之園苑無著無礙之渠流及于八正階陛令衆蹈之三明臺觀令衆升之法喜禪悅令衆味之慚珍愧瓔令衆飾之七覺之叢林蓊八解之花果芬芳歷重重之聖位遊處處之道場皆是因果相符事理相濟體用無礙悲智無方心境交參聖德難量神功巨議一剎如是十剎同然上約一德一行因果相似者言之若一度具諸度一德具多德互相涉入則非言思可及釋華藏名華藏莊嚴世界海者乃毗盧遮那如來所都實報無障礙土也華者蓮華也以持世界海大寶山王形相如之即蕊香幢藏者蓮子住處曰藏謂諸世界種在諸香水海中如世蓮子為藏所含其香海所依大地類世蓮房故莊嚴者謂寶地輪山樹林渠流宮殿樓閣階陛欄楯寶幢幡蓋寶垣繚繞華果園苑寶網懸空香草布地奇珍摩尼等世界海者謂諸世界種中諸二十重世界皆高十九佛剎微塵數廣極金剛山以其深廣難測故諭之為海
