body:
  text: 燕山沙門仁潮集三遍觀三界日天宮殿圖月天宮殿圖日月照用氣候寒暑星天宮殿圖四天王宮圖福報化生生天業因忉利天宮圖忉利業因三界安立圖諸天身壽諸天業因天人光明飲食精粗三界九地論諸天主四禪四地天有聖凡三界總別五衰退相心生六道圖釋總題前所觀境周小輪圍中至須彌通屬于地知下地已應觀上天天有三界曰欲界色界無色界此之三界皆是衆生所受報處為長者之大宅幼稚諸子遊戲其中者也如其四火焚燒三車在外有識之子寧不推排而出之乎日天子宮殿起世經云日天子宮殿天金頗梨所成城郭縱廣五十一由旬正方如宅遙看似圓有五種風吹轉而行閻浮檀金以為妙輦高十六由旬方八由旬日天子及眷屬居中受天五欲日天子壽五百歲子孫相承皆于彼治宮殿住正足一劫或是中劫日天子身光照金輦輦光照宮殿光明相接有一千光五百傍照五百下照日宮常行不息六月北行六月南行月天子宮殿月天子城郭五十由旬宮殿天銀青琉璃所成高十六由旬廣八由旬風持轉行月天子與諸天女在此輦中受天五欲月天子壽五百歲子孫相承宮殿住於一劫月天身光宮殿成千光明五百傍照五百下照長阿含云日天宮牆薄如花葩為五風所持日宮厚五十一由旬周回一百三十五由旬月宮厚五十由旬周回少三由旬或云住四十劫此小劫也日月照用起世經云何因緣故月天宮漸漸現邪有三因緣一者背相轉出二者青衣諸天常半月中隱蔽其宮三者日天有六十光障彼月輪去日漸遠故漸漸現復何因緣圓淨滿足亦三因緣一者面相轉出二者于十五日月光熾盛隱翳青衣三者月宮去日最遠日光不障復何因緣黑月十五即此方三十日一切不現此時月宮最近于日日光隱覆一切不現何緣名月于黑月一日已去乃至月盡光明漸漸減少故何緣月中影現此大洲有閻浮樹高大故影現月輪南洲日正中東洲日始沒西洲日初出北洲當半夜餘三洲例此又南洲所謂西方西洲謂之東方西洲所謂西方北洲謂之東方北洲所謂西方東洲謂之東方東洲所謂西方而南洲謂之東方也立世云以衆生業力增上緣故故有風輪吹日月等宮回轉不息日行百八十路月行十五路復有二路內路外路日行與月或合或離一一日中日行四萬八千八十由旬若稍合時日日覆月三由旬又一由旬三分之一是故十五日被覆月光不現若稍離時日日日行同前是日離月三由旬又一由旬三分之一是故十五日月大圓明若日隨月後行日光照月光月光粗故被照生影影還自翳故見月後分不圓以是事故漸漸掩覆日在前行例此可知又日行周圓速疾于月六月日從內路出至外路六月從外路入內路若月十五日從內至外十五日從外至內如日行南洲內路則行北洲外路則行東西二洲中路是時南洲日最長十八牟休多夜最短十二牟休多北洲夜長十八牟休多日短十二牟休多東西二洲日夜等分并十五牟休多如南洲三洲例之可知一牟休多當此方三刻三釐三毫三絲三忽也氣候寒暑起世經云何緣夏熱以日宮六月向北行時有十因緣日光照觸十種山故令其生熱又何緣寒冷以日宮六月向南行時有十二緣生冷須彌七山中間各有大海及四洲大河日光照彼海水故生寒冷又何緣有此河水以有日故熱熱故有炙炙故有蒸蒸故有汗溼以汗溼故一切山中汗流為水以成諸河立世云何緣冬寒春熱夏時寒熱是冬時水界最長未減盡時草木由溼未萎乾時地大溼滑火大向下水界上升何以知然深水最暖淺水最寒時節已至日行外路照炙不久是故冬時則寒春時水界長起減已盡草木乾萎地已燥坼水界向下火界上升何以知然深水則冷淺水則熱冬時已過日行內路照炙則久以故春熱是故大地八月日中恆受照炙雨水灑散地氣蒸若風吹蒸氣消時則寒風不吹時則熱故夏有時寒熱天竺四月一時故但立三時星天宮殿圖大集經過去媻伽媻仙分布星宿攝護國土養育衆生各有所主東方角氐房心尾箕北方斗牛女虗危室壁西方奎婁胃昴畢觜參南井鬼柳星張翼軫具如本經與孔雀經大同消災經有九執大天二十八宿十二宮辰楞嚴經八萬四千災變惡星文句毗沙門為星宿之主諸星形量依樓炭經大星圍七百二十里中星四百八十里小星百二十里星是諸天宮宅瑜伽論大星十八拘盧舍中星十拘盧舍小星四拘盧舍一拘盧舍六里也阿含大星一由旬小星三百步星宮最小者徑半俱盧舍周回一俱盧舍星大者徑十六由旬周回四十八由旬里數多少不同者或聞記稍異不必合會磐師述曰若依內經星宿并是諸天宮宅內有天住依報所感福力光現俗書即云天為精氣日為陽精月為陰精星為萬物之精星有墜落乃為石矣夫遙大之物非凡度量令人難知莫若天也星若是石不得有光性又質重何所繫屬一星之徑大者百里一宿首尾相去數萬百里之物數萬相連濶狹縱斜常不盈縮又星與日月光色同耳但以大小差別然而日月亦當石邪石既牢密烏兔焉容石在氣中豈能獨運或謂日月星宿是氣然氣體輕浮當與天合環轉循順其間遲疾移動不均寧當氣墜忽變為石昔山西某縣災雨太作時空中有石落地如碓觜人皆不識何故後有胡僧曰龍食也龍爭食故落下蓋龍以石為食也凡空中在落類乎此罥索經云日天子月天子二十八宿天七曜星天是諸天等種種衣服具莊嚴之半跏趺坐須彌山半四天王居因本智論四萬二千由旬毗曇俱舍四萬由旬東方有城名上賢南方有城名善見西方有城名周羅北方有城名天敬長阿含智論同四天王宮圖東方治國天王多用持國華嚴提頭賴吒領乾闥媻毗舍闍護東洲人乾闥媻此云尋香行帝釋樂神也毗舍闍云噉精氣鬼智論富單那南方增長天王令自他善根增長故華嚴毗留勒叉領鳩槃茶薜荔多護南洲人鳩槃茶此云厭魅鬼薜荔多云最初餓鬼西方雜語天王孔雀廣目專主罰惡令遇苦發心華嚴毗留摶叉領龍及富單那護西洲人富單那云臭餓鬼智論作毗舍闍北方多聞天王福德之名聞四方故華嚴毗沙門領夜叉羅剎護北洲人夜叉此云捷疾鬼能速疾傳報者也羅剎云暴惡食人鬼也阿含經四王有二十八部鬼神金光明嫁娶行欲如人間阿含經四王各有九十一子有大威力皆名帝能護十方大吉義經一切山河樹林土地城郭一切鬼神皆屬四王智論一王有八將軍共三十二將周四天下護出家人韋將軍于三十二將中最存弘護比丘道力微者為魔所惑將軍悽惶奔赴應機剪除天人感通傳福報化生阿含經云四天王天初生自然化現在天膝上自然寶器盛天百味食已長大與餘天等入池浴訖詣香樹下香樹曲躬取香塗身復詣吉具衣樹取種種衣著復詣莊嚴樹鬘樹器樹果樹樂樹隨意受用視東忘西視西忘東無量快樂宮殿園池種種具如經中起世經云四王天初生時如十二歲兒于父母坐處或兩膝兩股忽然而生即有寶器盛天須陀及以天酒隨福上中下有白赤黑色飲食既訖身量即與舊男女等生天業因起世經云諸有一種身口意善行如是作已身壞命終生于天上此處識滅彼天上識初相續生行識生時即共名色一時俱生有名色故即生六入若是天男即于天女坐膝邊生若是天女即于天王䏶股內生如是生已彼天即稱是我男女忉利天宮之圖三十三天名出正法念處經忉利梵語具云怛利夜登陵奢此云三十三天須彌山頂縱廣八萬四千由旬其中平可居者止四萬由旬婆沙論順正理論三十三天迷盧山頂頂四面各八十千山頂四角各有一峰高七百由旬七寶合成金銀琉璃頗梨真珠硨渠瑪瑙之所莊嚴因本經婆沙高廣五百由旬正理同有藥叉神名金剛手于中止住守護諸天山頂善見大城周萬踰繕那重門高一由旬半城有千門嚴飾壯麗各有五百青衣藥叉各嚴鎧仗防守城門中央金城周千由旬正理論云殊勝殿周千由旬其地真金雜寶嚴飾柔軟如妒羅綿隨足高下帝釋住處城有五百門中有樓閣名皮禪延四邊寶樓一百一所內一萬七百房一一房有七天女一一天女有七彩女其諸天女皆帝釋正妃帝釋與舍脂女共住化身與諸妃共住毗曇阿含略同目犍連尊者遊歷小千界無有端嚴如毗闍延堂者雜阿含即毗禪延城內衢巷天人隨福屋舍多少路有五百有七市曰米穀飲食衣服衆香戲女工巧華鬘市並有市官天子天女往來貿易商量貴賤具市廛法雖作是事無取無與脫欲所須便可提去是善見城復有天州天縣天村周匝遍布因本經三十三天其城縱廣六萬由旬七重城壁七重欄楯七重鈴網外有七重多羅行樹周匝圍繞雜色可觀亦以七寶所成城高四百由旬厚五十由旬城之四面亦各相去五百由旬于其中間便開一門諸門高三十由旬濶十由旬一一諸門亦有樓櫓却敵臺榭庭閣水沼華林種種奇妙衆鳥和鳴天樂時奏念衣衣來欲食食至重重向上粗業漸輕福業轉勝因本經城外善見城外四面有四苑一衆車苑因本雜色車苑雜阿含東門外隨天福德種種車現東照明園有佛髮塔二粗惡苑因本粗澀苑雜阿含南門外天欲戰時甲仗自現南粗澀圍有佛衣塔三雜林苑因本云雜亂苑月八十四十五三十三天放宮內采女入此苑中與天衆合雜嬉戲受天五欲雜阿含經云西門外諸天入中極妙欲塵雜類俱至西歡喜園有佛鉢塔四喜林苑因本入中皆受歡喜雜阿含北門外諸天所玩皆生歡喜城北駕御園有佛牙塔四苑各周千由旬各有一如意池周五十由旬池中八功德水城外東北有圓生樹花開之日順風香聞百由旬逆風猶及五十里即經云波利質多羅樹香城西南有善法堂三十三天時集辨論制伏阿素洛如法不如法事順正理論善法堂最中有師子座毗耶仙人經善法堂有八萬四千柱入此堂者無惡觸睡眠頻呻等過帝釋升座左右各十六天王行列向坐有二太子是二大將軍坐諸天王左右持國天王與大臣軍旅恭敬諸天依東門坐增長天王依南門坐廣目天王依西門坐多聞天王依北門坐是四天王以世間善惡奏聞帝釋諸天王月八日四王大臣遍行世間十四日四王太子行十五日四王自行觀察善惡若無多人受戒布施帝釋聞奏憂惱説言天衆減損修羅日增阿毗曇論本為人時施飲食燈明錢財故名釋提桓因此云能天主本為人時姓故名憍尸迦舍脂為第一后故名舍脂鉢底于一座間思千種義故名千眼華嚴帝釋現身有千眼手持金剛出火焰正法念現身有千頭于三十三天為主故名因提利中阿含經問人中四洲由日月輪以辨晝夜欲天晝夜云何得知答鉢特摩花合嗢鉢羅花開多樂睡眠爾時為夜若嗢鉢羅花合鉢特摩花開少欲睡眠爾時為晝婆沙論天宮晝夜光明故以花開合辨三十三天生時天女手中花生自知有兒即以授夫七日天生善知天法行宮殿中見無主天女來言聖子善來此汝宮殿我無夫主今相供養毗耶仙人經或天王欲遊戲時天女圍繞奏諸音樂至彼天宮彼宮天王相迎入內共坐亦奏天音樂食天蘇陀飲天甘露諸天女和雜娛樂遊一天已復至一天彼天相迎娛樂同前如是遍歷三十二天諸天宮殿寶樹園苑境界光色各異或黃金宮殿白銀琉璃頗梨宮或二寶三四色寶七寶宮殿寶垣寶樹等光色各異亦如是或一王二王共遊乘寶車乘寶船遊香水河微妙五塵快樂無量天女奏樂歌舞言笑相牽相勸遊玩去來欲心熾然又往餘處最為放逸于是帝釋乘寶輦天女圍繞奏樂而來其諸天王恭敬迎禮帝釋現神通力示未來苦相誡敕諸天勤修道業慎勿放逸諸天奉行各還本宮具如正法念經此經云帝釋是初果須陀洹業因智論云昔媻羅門姓憍尸迦與知友三十二人共修福德命終皆生須彌山頂憍尸迦為天主三十二人為輔臣淨名疏昔迦葉佛滅度後有一女人發心修塔報為天主三十二人助修報為輔臣君臣合之為三十三四教儀單修上品十善生忉利天總因也長阿含經云于佛所淨修梵行命終生忉利天增益五福謂壽色名稱樂威德阿含經云僧尼持二百五十戒等亦是生天業溫室經浴僧淨業亦得生天雜阿含經云施勝妙衣及愛念物施妙香施妙食不殺生不貪嗜不懈怠節食施貧人食執節卑遜或見僧尼聞正法一宿受齋戒業因並生天上宮殿隨身身金色受勝天樂正法念經持不殺不盜不淫等皆得生天又云殺盜淫業若生人中身色憔悴無有威德若有餘業得天中身形貌減劣寶莊嚴具光明微少天女皆捨餘天輕笑若與修羅戰為他所殺法苑云若持不殺戒得生四王處不殺不盜生忉利不殺盜邪淫生夜摩天更加不妄語兩舌惡口綺語生兜率天奉佛戒兼身口七善業生化樂他化天經云帝釋天王欲遊行時出宮門外向南合掌恭敬三禮有御馬夜叉神驚怖墮鞭帝釋問曰爾小鬼神何故驚懼夜叉曰天王于三十三天中為至尊更無過上今復向空頂禮豈更有尊上者是以怖耳帝釋曰我禮南贍部洲佛陀僧伽出世聖賢汝小鬼神不知乎于是夜叉信悟禮帝釋天王足經云帝釋得須陀洹果教誡天人修諸道品進趣涅槃又以因修戒善報得天身故敬法是本行三界次第安立之圖三界次第安立説下方虗空中有大風輪高百六十萬由旬俱舍論水輪高八十萬由旬廣百草萬三千四百五十由旬俱舍論以衆生業力水不流散如食未消不墮熟臟因本經金輪高三十二萬由旬廣與水輪同俱舍論水上有風風轉此水于上成金輪如熟乳生膏是名金輪厚三洛叉二萬由旬因本經地輪深六十八千由旬新菩薩藏經及增一經同輪圍山內鹹海七金山香水海至須彌山根上升一萬由旬繞山縱廣一萬由旬是堅手天住婆沙復上一倍因本二萬繞山八千由旬持華鬘天住一倍者一萬也復上一倍因本三萬繞山四千由旬常放逸天住復上一倍因本山半四萬二千四王住繞山四千由旬日月星宿天住復上一倍繞山四千由旬是四王天住須彌山下別有三級諸神住處皆有七重牆垣皆夜叉住因本此三天皆藥叉住四天王之所部俱舍復上升四萬由旬山頂縱廣四萬由旬其中善見城縱廣萬由旬是三十三天住即從此山上升四萬由旬或十六萬有處如雲七寶所成其猶大地是炎摩天住復上一倍或三十二萬有地如雲是兜率天住復上一倍有地如雲是化樂天住復上一倍有地如雲是他化天住次第乃至色究竟天皆有地如雲上倍者豎高也廣如忉利縱廣四萬炎摩八萬乃至他化次第倍前從廣六十四萬由旬也媻沙論因本經云須彌山上忉利天以上一倍有夜摩天又更一倍有兜率天展轉至梵身天下有摩羅波旬宮殿梵身天上有光音天倍光音有遍淨天倍遍淨有廣果天倍廣果有不粗天其下別有無想天倍不粗有不煩天次第善見天善現天至阿迦尼吒天色究竟也上更有名空處識處無所有處非非想處毗曇論佛言梵處近遠如九月十五日有人在梵處放百丈方石墜向下界中間無礙到後歲九月十五日至閻浮地如是兩倍至無量光天又兩倍至遍勝光天倍倍加上乃至阿迦尼吒天此天放大石山經六萬五千五百三十五年中間無礙至閻浮地智論云從色界初際下一丈石經一萬八千三百八十三年方始至地諸天身壽身量依俱舍論衣量依長阿含經壽量依俱舍毗曇及較量壽命經欲界六天者四天王身量半里衣重半兩人間五十歲為一晝夜壽五百歲忉利天身量一里衣重六銖人間一百歲為一晝夜壽一千歲夜摩天身量里半衣重三銖人間二百歲為一晝夜壽二千歲兜率天身量二里衣重二銖人間四百歲為一晝夜壽四千歲化樂天身量二里半衣重一銖人間八百歲為一晝夜壽八千歲他化天身量三里衣半銖人間千六百歲為一晝夜壽一萬六千歲魔羅波旬天衣重半兩六十四分之一壽三萬二千歲色界壽命用劫為量不著衣服如著不異頭雖無髻如著天冠無男女相形惟一種出因本經初禪三天華嚴梵衆下有梵身天梵衆天壽命半劫半中劫為二十小劫身長半由旬二十里梵輔天壽命一劫四十小劫身長一由旬四十里大梵天壽命一劫半六十小劫身長一由旬半六十里二禪三天華嚴初有光天少光天壽命二大劫成住壞空總為一大劫身長二由旬光明最少無量光天壽命四大劫身長四由旬光明勝前故光音天壽命八大劫身長八由旬無覺觀語言以光當語故此天語時口出淨光三禪三天華嚴初有淨天少淨天壽命十六劫身長十六由旬以離喜受染為淨未及上位為少無量淨天壽命三十二劫身長三十二由旬清淨勝前故遍淨天壽命六十四劫身長六十四由旬清淨周遍無有過患故四禪九天華嚴云廣天等無雲天壽命百二十五劫身長百二十五由旬此上不依雲住福生天壽命二百五十劫身長二百五十由旬有勝福力廣果天壽命五百大劫身長五百由旬果報最勝故無想天壽命五百大劫身長五百由旬心想不行故無煩天壽命一千大劫身長一千由旬無希望故無熱天壽命二千大劫身長二千由旬離熱惱故善見天壽命四千大劫身長四千由旬定障漸漸見極明故善現天壽命八千大劫身長八千由旬形色轉勝善能變化故色究竟天壽命萬六千大劫身長萬六千由旬色法最極無色界四天無色界天無四種色有定果色當知無色界無有色界故無有身量空無邊處天壽命二萬大劫定行慧行各得一萬厭色依空故識無邊處天壽命四萬大劫定慧二行各得二萬厭識依識故無所有處天壽命六萬大劫但有定行相倍厭識依識性非非想處天壽命八萬大劫亦但定行相倍媻沙研窮識性似盡不盡故阿含經云齊此為衆生生老病死往來所趣陰界入聚也因本經云是此世界中所有諸衆生有生老死墮在如是生道中住至此不過是故名娑媻世界無畏剎土諸餘十方一切諸世界亦復如是諸天業因智度論云欲界衆生有三種以善根有上中下故上者六欲天中者人中富貴下者人中卑賤又云上分因緣天道果報中分因緣人道果報下分因緣修羅果報修羅雖與天相似以其結使覆心心多邪曲近道難故在人下四教儀云四王忉利單修上品十善得生若夜摩以上兼修未到定得生亦名欲界定次第初門云若自尸羅皎潔志在禪門專修五法則色界清淨四大自現身中緣是次第獲得根本四禪種種勝妙支林功德爾乃因超欲網果居色界五法者欲精進念巧慧一心也支林者四禪共有十八支也又禪定中覺冷熱等樂叢沓如林備見止觀業報差別經云若衆生具修增上十善得欲天報修有漏十善與定相應得色天報修四空定得無色天報天人光明智度論云諸天業報生身光者欲界諸天以燈燭明珠等施及布施持戒禪定等清淨故身常光明不須日月所照色界諸天行禪離欲修習火光三昧故身出妙光勝于日月及欲界光是諸光明皆由心清淨故得佛常光明面各一丈諸天光明大者雖無量由旬于丈光邊蔽而不現憍尸迦作是念言佛妙光明蔽諸天光智慧之明破我愚暗長阿含經云螢火明不如燈燭燈燭不如炬火炬火不如𧂐火𧂐火明不如四王宮殿衣服身光四王天光不如忉利天光明展轉乃至色究竟天光明不如大自在天光明自在天光不如佛光明諸光合集不如四諦法光明達摩云諸光之中智光為上諸明之中心明為上論形色毗曇云南洲衆生種種色相東西二洲唯除黑色餘同南洲北洲人皆白色四王天四色有紺赤黃白欲界諸天色皆如是如初受生時若見紺花則身紺色赤黃白等亦如之或云梵王白銀色衣金色色界天黃金白銀二色色界中亦有入青赤黃白遍處定故不止二色飲食精粗起世經云一切衆生有四種食一粗段及微細食四洲上至六欲皆同以上色無色天並以禪悅法喜為食無粗細食二觸食一切卵生得身故以觸為食三思食謂意思資潤諸根增長如魚鱉蛇蝦等及餘意思潤益諸根壽命者四識食謂地獄衆生及無邊識處天等皆用識持為食或名揣觸念識揣謂人龍鳥皆揣食揣即摶也餘義同楞嚴經云如是世界十二類生不能自全依四食住所謂段食觸食思食識食是故佛説一切衆生皆依食住溫陵注人間段食謂所餐必有分段鬼神觸食但散觸而他禪天思食食至但思之則飽識天識食既無形色但以識想也欲界諸天福厚者隨思具足甘露盈杯百味俱至福薄者雖有飲食恆不稱心經云諸天共寶器食隨其福德飯色有異上者見白中者見黃下者見赤正法念經云炎摩以上盡色界天貧富皆等忉利以下報有厚薄福厚者一切具足有餘福薄者雖有衣服宮殿食常不足曾有薄福天患飢故下閻浮摘酸棗食人見形殊怪問答曰我非人薄福天也以有宮殿食常不足故爾下求由修戒忍不修施故三界九地通論界地者謂三界九地也一欲界六天下二名地居天上四名空居天四王謂于四方統攝諸部鬼神故忉利謂須彌頂有三十三天宮故四教集云夜摩此云善時以華開合分晝夜故兜率此云知足于五欲境生喜足故化樂于境善化而受樂故他化于自他境皆能自在化用故樓炭經云欲色二界中別有魔宮其魔懷嫉譬如石磨磨壞功德縱廣六千由旬宮牆七重大論魔羅番奪命波旬王名番殺者常欲斷人慧命涅槃疏依于佛法而得善利不念報恩反欲加毀輔行記魔字從石梁武以來謂能惱人易之為鬼淨名云多是不思爾解脫菩薩應為魔王垂記第六天上別有魔羅所居他化天攝即天子魔也以前通名欲界規矩注欲謂飲食睡眠淫欲也又偈云六受欲交抱執手笑視淫謂四天王交忉利抱夜摩執手兜率笑化樂熟視他化暫視欲有厚薄也亦名五趣雜居地天人三塗也修羅天趣攝鬼畜遍五趣皆有三欲二色界十八天雖離欲染尚有色質故名色界通名梵世為已離欲染也通號四禪為離散動也欲界但十善感生此天兼禪定感生然有漏禪觀六事行耳六行者厭欲界苦粗障欣色界淨妙離也此是凡夫伏惑超世間道也初禪俱舍論名離生喜樂地謂離欲界雜惡生得輕安樂也二禪俱舍名定生喜樂地謂有定水潤業憂懸不逼也資中曰二禪已上無有語言但以定心發光光有勝劣分其高下三禪名離喜妙樂地心雖離喜而喜樂自具也初門云初禪五支覺觀喜樂一心二禪四支內淨喜樂一心三禪五支捨念慧樂一心也其修證相具止觀中四禪九天然四禪報境但有三天無想乃廣果別開經二岐一直往趣廣果二迂僻趣無想此四之上有五不還天不復欲界受生故乃聖賢別修靜慮資廣果故業而生與凡夫不同故又別列亦名五淨居通名捨念清淨地初門云四禪四支不苦不樂捨念一心亦名根本四禪初門云四無量心背捨勝處一切處神通變化及無漏觀慧諸禪三昧悉從中出故稱根本三無色界有四天無業果色有定果色依正皆然乃滅身歸無定性聲聞所居或無想外道別報或捨厭天人雜處其類不一皆無色蘊色界至此依溫陵解空處者行者厭患色籠心欲出離即修觀智破三種色可見可對色眼見色塵也不可見可對色聲香味觸也不可見不可對色意緣法塵即無表色也識處者謂厭患虗空無邊修觀捨前外空更緣內識無所有處者外境名空內境名識捨此二境入無所有定非想非非想處者非識處之有想非無所有之無想捨前二處而入上定初門亦云凡夫外道得此定謂證涅槃斷一切想故言非有想佛弟子如實知有細想依四衆而住故云非無想得失合名順正理論云一切天衆皆作聖言為彼言辭同中印土然不由學自解典言論無色界身處有二義初言無處者媻沙云四空離形報無別處但在欲色二界成就四空無色業言無身者俱舍云無色無身纂云無業果色非異熟身楞嚴云是四空天身心滅盡定性現前無業果色孤山注曰無業果色顯有定果色也次言有處者起世云倍色究竟有空處乃至非非想處皆名諸天住處華嚴云菩薩鼻根聞無色宮殿之香言有身者阿含云舍利弗滅時無色界天淚下如春細雨仁王經列無色天衆中陰經云如來至無色界中諸天禮拜大衆部云但無粗色非無細色淨名疏云若不了義教明無色界無色若了義教明無色界有色涅槃經云無色界色非聲聞緣覺所知今此所明當從後義論諸天主論天主有通別二義通論者魔梵欲色各有主義釋籤云四天王主四天下此言巡遊賞罰為主大論云帝釋為二處天主四王忉利魔王為欲界主居欲界頂故大梵王為三界主淨名疏帝釋是地居天主梵王是娑媻世界主統御大千統御上下天人感通傳答南山云魔王雖欲界主帝釋四王若行佛法魔不能制妙樂云梵即色主亦三界主魔為欲主輔行云梵王為三界主餘皆臣屬別論者又三初獨論梵王文句云梵王住初禪中間內有覺觀外有言説得主領為王單修禪為梵民加四無量心為王又云梵王號令總上冠下別行疏梵即色主名為尸棄毗曇云二禪以上無語言法故不立王禪門云初禪有覺觀心則有語言法主領下地衆生為便二獨論摩醯大論云摩醯首羅八臂三眼騎白牛又云過淨居天有十住菩薩號大自在大千界主灌頂經字威靈帝華嚴經云大千世界主摩醯首羅涅槃疏云若言世界主正是摩醯首羅輔行云摩醯首羅能覆大千舉世尊之以為化本三魔梵對論涅槃疏云摩醯首羅居色界頂主大千界若法華中列世界主梵天王者其實祗領小千經家美之故言主耳私謂章安判云此是大千之中得為大千之主降此不得大千界有萬億梵王此處梵王尸棄居大千之中故稱為主自餘諸梵所居既偏故不得為主也今故斷之曰摩醯處于色頂以報勝為主梵王居大千之中以統御為主四禪四地述曰自昔談天未知四禪四地之義以由諸文森列不能區別耳據因本經阿毗曇媻沙論等皆以天名次第豎高相去倍遠皆有住地此等立義未足可憑今依俱舍云梵天無別處所但于梵輔中有高樓閣者是法苑亦爾大梵是君梵輔是臣梵衆是民據此則三天同在初禪止一地耳若薩媻多部以無想廣果身壽不殊同為一處楞嚴云從福愛天有二岐路福德圓明名廣果天身心滅盡名無想天二岐即是分二類耳與薩媻多義同同一處也又云此中復有五不還天此中指四禪四禪四位天王但有欽聞不能知見如世間深山道場阿羅漢住世間粗人所不能見據此則知祇一廣果稱王而于此中具有五那含一外道同居四禪祗一地耳次第禪門云佛于仁王説十八梵亦應有民主之異又云四禪中有大靜王纓絡經明禪禪皆有梵王楞嚴亦四禪四位天王華嚴列衆三十九位其間則欲界天天稱王色界則禪禪稱王餘天不列今詳初禪既以大梵為王而三經皆説四禪有王仁王纓絡楞嚴則知光音遍淨廣果三天皆王自餘皆一臣一民之義今故依等大乘經旨初禪至四禪立為四地云廣果為王福愛為臣無雲為民五那含一外道則寄居廣果天中已上九天同居四禪一地也二禪三禪例之或以天天身壽不同須各分處如諸小乘經論者然梵王之與梵輔梵衆若身若壽皆長短不齊又廣果無想雖五百劫廣果則有中夭無想定滿其報以此論之雖身壽不同不妨同處亦猶閻浮之人有壽有夭也乂華嚴謂諸天王皆十地菩薩者此等皆是權來引實在于天中化諸實報之天使求脫天業故得稱王若謂王者敻居一處與餘天隔異則將焉用彼王餘天何所依仰不作此論豈不大乖其義或謂二禪以上無語言法毗曇何以為化者然光音既以光為語則知上地諸天威儀進止無非言教以是義推無不可者天有凡聖媻沙論問三十二天六欲十八梵四空天及恆憍堅首持鬘并日月星宿幾凡幾聖答二唯凡住五唯聖住自餘二十五天凡聖共居言二唯凡住者一是初禪大梵天王不達業因唯説我能造化天地恃此高慢輕蔑一切所以聖人故不與居又無想天中唯是外道修無想定以生其中受五百劫無心之報外道不達謂為涅槃受報畢已必生邪見來生地獄聖人亦不生其中也五唯聖住者廣果已上無煩無熱等五淨居天唯是那含羅漢之所住也凡生彼天者要是進向那含身得四禪發于無漏起熏禪業或起一品乃至九品方乃得生凡夫無此熏禪業故不得生也若言那含生彼理則無疑問阿羅漢既是無生何故亦云生彼天者答此應言欲界那含生彼而得羅漢非謂先是羅漢而生彼也三界總別總名三界曰欲色無色也自下從金剛際上至他化天中間五趣雜居一切有情未離貪欲故名欲界自梵衆上至色究竟此十八天正報身相如銀白色宮殿真金赤色光色互照故名色界自空處至非想處此四天人同碧落界若虗空四蘊成身無色蘊故名無色界亦名三有別名二十五有謂四洲四惡趣地獄鬼畜修羅六欲並梵天四禪四空處無想五那含皆名為有者謂因屬有漏果係有為有生有死故五衰退相因果經云天人身淨不受塵垢有大光明心常歡悅無不適意之事猶為欲火所逼福盡之時五衰相現一者頭上華萎二者眼瞬三者身光滅四者腋下汗出五者自然離于本座媻沙有衣服穢染體生臭氣無眼瞬光滅餘三同上又云此諸天子本修少善得受天樂果報將盡生大苦惱墮三惡道本造善行為求樂報今得少樂後復多苦譬如飢人噉雜毒食初雖為美終成大患云何智者貪樂此也色無色諸天見壽命長便謂常樂既見變壞生大苦惱即起邪見謗無因果以此事故輪回三途備受諸苦三界之中無有一樂智度論云菩薩得神通力見無色界天樂定心著不覺命盡墮欲界中受禽獸形色界諸天亦復如是從清淨處墮還受淫欲在不淨中欲界六天樂著五欲還墮地獄如頭藍弗得非想定報盡後墮飛狸身中述曰夫三界定位六道區分粗妙異容苦樂殊迹觀其源始不離色心檢其會歸莫非生滅生滅輪回是曰無常色心幻影斯為苦本故涅槃論之以大河法華方之于火宅聖人啓悟息駕返源超出三有漸愈十地也尋夫天報雖復豐華服玩光新身形輕妙而自在天上更是魔王無想定中翻成外道非想定後尚墮狸身六欲雜染迷惑殊重不能受持般若供養涅槃憍慢轉增我人愈勝所以頭卒萎髻腋汗流襟寶殿歇光羅衣聚膩福盡衰至難免無常憑斯淨心悉皆懺蕩普願永離苦因清升常樂也心生六道圖夫人皆有心有心必有念念起必有染淨染謂取著六塵淨謂不取六塵且世人未有不染六塵者若取著六塵而起貪嗔淫殺等業是為惡若于六塵不起貪嗔淫殺等是為善又于六塵而行施戒忍等是為善善惡之業成于今則苦樂之報應于後以其因中善惡有上中下之不同故其果中升沈有天人修羅地獄鬼畜之異也在六道中又復造業業復續報是故六道輪回不息觀其原始由我心念而生故佛言三界惟心萬法惟識是以善修道者惟明于此謹其初念制其染心斯為要術若于六塵而不取不取即無業無業即無報是故一念不生則六道俱銷輪回斯絶業種既斷斯出三界矣若居不生而證真身心永息是為二乘若從不生處而起六度萬行是為菩薩大乘若似斷未實斷煩惱本未證未得真理帶異計邪見者是為外道未免輪回是故縛脫由心得失在我修行者其鑒之
