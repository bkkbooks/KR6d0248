body:
  text: 燕山沙門仁潮集録一略明南洲佛興緣夫塵寰寥廓異趣紛綸織十惑之緻網覆五陰之重雲沈迷欲穽縈繞稠林薰蒸于畏宅之焰回旋于生死之輪加以業浪長漂去覺源而轉遠癡城危錮處永夜而難醒沙劫易過苦流無已是以六通至聖十智能仁被弘誓鎧運大悲輪不動真際而智周法界常住三昧而普現色身升慧日于幽關震法雷于夢宅演圓音而廣被灑甘露以均霑俾脫險途令登覺岸洎夫八相示成十天敷妙津梁九地舟輿四生雖真乘上智拯萬彚以興慈大誓甄陶任根緣而利益是則羣生以苦感為因如來以悲應為緣也賢劫緣佛興利物時當賢劫何名賢劫謂大千世界初欲成時大水彌滿有千枝蓮華出現金光普照淨居天見乃曰希有此瑞當有千佛出興于世以是因緣遂以此劫號為賢劫釋迦牟尼如來乃賢劫第四佛我等之所師為娑婆之教主娑婆疆域佛所王土號曰索訶世界古經翻為婆婆經中所謂忍土是也謂此土人強識力能忍苦樂堪任道器故佛王之案此封疆周輪鐵山山外是空空不可測山下是地地下是金金下是水水下是風其風堅密逾于金剛衆生心力同業所感能持世界不令傾墜自風以外即是虗空約此周輪從下而上至無色窮名為有頂論其盡界縱廣卒非里數之所度也依智論從色界下一大石經一萬八千三百八十二年方始至地約此上方名為一佛所王土也輪山內有百億四天下今初且明一四天下之南洲有二一震旦國東土震旦國區域之興帝嚳九州冀兗青徐攝荊豫梁雍舜十二州以冀州土潤增置并幽營三州夏禹平水土分別九州揚荊豫青兗雍幽冀并周大封建蓋千八百國春秋之世見于經傳者百二十有四國下至戰國七雄并而為秦懲周封建之斃罷侯置守分天下為三十六郡及南平百越又東震旦國圖置閩中南海桂林象四郡兩漢以十三州統治漢武置十三部刺史晉為十九州唐為十道後又為十五采訪使宋朝元豐頒行李德芻等所僎九域志分為二十三路漢盛時四履之地東樂浪西燉煌南日南北鴈門東西九千里南北萬三千里古長城戰國時趙築之自代並陰山至高闕二州名以備胡燕亦築媯州之北至遼東秦始皇令蒙恬築長城起臨洮入高麗元為十八道至皇明一統置南北二直𨽻并十三省四瀆者河出磧石江出岷山淮出桐柏濟出王屋山五嶽泰東衡南華西恆北嵩中南贍部洲圖仰尋諸佛之降靈也不可以形相求之隨機顯晦故得以言章述矣自法王示迹照臨忍方羣生何幸仰茲陶誘使夫二十五有絶生死之因九十八使斷牽連之業並超三界俱載一乘含育蒙大造之恩至人引勤勞之慮故有垂慈聖迹布此靈儀令重昏動其玄機識浪靜其漂怒方為入道弘轍亦乃出有初門而事總冥權理符神運抑非天授諒實人謀但禎瑞氤氳嘉祥雜沓喗煥天地引耀幽明然則文物光乎萬古聲明高于視聽所以薄列鴻猷用觀弘範也案西域志云贍部中心名阿耨達池在香山南大雪山北周八百里起世經雪山衆寶所成頂有四金峰中一高峯峯有龍池五十由旬十地菩薩化為龍王于中潛宅出清冷水以給贍部池之東面銀牛口流出兢伽河即恆河繞池一匝入東南海池南面金象口流出信度河繞池一匝入西南海池西面琉璃馬口流出縛芻河繞池一匝入西北海池北面頗胝師子口流出徙多河繞池一匝入東北海或曰潛流地下出積右山為東華黃河之原蔥嶺當贍部之中南接大雪山北至熱海千泉西至活國東至烏殺國四方各數千里崖嶺數百重冰雪風寒山阜蔥翠故名蔥嶺自蔥嶺東近高昌國曰阿耆尼漢書焉耆有伽藍十數西南屈支舊曰龜茲伽藍百所蔥嶺之北四百里曰清池亦名熱海西行千里曰千泉南有小雪山突厥避暑之處西至呾羅私乃至史國東南入鐵門南出至覩貨羅東至蔥嶺南至雪山西至波斯北據鐵門有三十國逾諸國至縛曷北臨縛芻河伽藍百所人謂之小王舍城從此西南逾諸國東南入大雪山山阿有龍洞佛化其龍留影于洞唐玄奘親往禮拜遠望則金色炳著近則不覩漸隱沒次至梵衍那國有臥佛長千丈商那尊者胎生無條衣尚存東逾黑嶺至迦畢試國北背雪山伽藍百所東入北印度境至健馱羅國有大塔高五百尺魏胡太后遣使持長幡五百尺挂之腳方及地此塔與洛陽伽藍記同一時當有二塔北至烏仗那國釋種被斥王此古輪王之苑僧常萬人南渡信度河踰諸國東南至迦溼彌羅國伽藍百所踰諸國東北至末兔羅國毱多度人籌盈石室東北至室伐羅次至窣祿那東臨恆河東渡河至末底羅東去北雪山邊有金氏國女為王不知政事此東去接吐番北接于闐西接末羅婆自末底羅東南至醯呾國佛為文鱗龍王説法之處南渡兢伽河河左有塔千座東南至劫比它國佛在忉利為母説法帝釋現三道寶階之處西北至曲女國戒日王設大會令玄奘立真比量論義處東北至舍衛國城南五里有祇樹給孤園東南至迦毗羅國佛降生處淨飯王殿摩邪夫人殿菩薩降胎處殿佛成道後還本國度八王子釋種處東北至拘尸那國娑羅雙樹林佛入涅槃處西南至波羅奈國鹿苑轉法輪處近苑有支那寺國王為衆僧造支那此云大唐順兢伽河東北至毗邪離國舊名毗舍離有維摩丈室縱廣十尺東北至弗栗恃北印土境西北至尼波羅此國北境即東女國與吐蕃接命使往還率由此地唐梵相去萬里自古取道迂遠此國有池水面火起中有火龍自毗邪離南渡兢伽河至摩竭提國或摩伽陀中印有王舍城西南渡尼連河伽邪城城西六里伽邪山俗呼靈山西南菩提樹樹高五丈佛成道處周垣五百步中有金剛座千佛坐之入金剛定那闌陀寺五王共造僧徒數千并俊才高學國東南雞足山迦葉入定處東北靈鷲山王舍城有熱泉涌出目連云此水經過小地獄來故熱沸而垢濁有三深井大水不滿謗佛生陷處東北踰諸國至奔那伐自信度河東至此皆中印次東至迦摩縷東印從此東去山阜連接可兩月行至蜀西南界南至三摩怛東北海濱西南乃至烏荼國東南臨海有城海商止處南去執師子國二萬里夜望其國佛牙塔寶珠光如大炬踰諸國西北至憍薩羅中印有王引正為龍猛造寺集千僧計工人食鹽價田九億金錢國南有山山崖之上石閣五層層有四院飛泉流注踰諸國南至末羅矩南印濱南海有末剌邪山出龍腦香樹香如氷雪此山之東有布呾洛迦山山頂有池池側石天宮觀自在菩薩遊舍于此有願見者厲水登山東南海有執師子國北印土境有佛牙精舍上建表柱置大寶珠夜望如明星王宮側建大厨日營萬八千僧食常興此供不絶南數千里有那羅稽羅洲人長三尺為鳥喙食椰子肉此洲東南有稜伽山自達羅毗至北恭達補南印土有貝多羅樹林周三十里其葉長廣色光潤五印書寫莫不采用今貝葉乃略名林西二千里至摩訶剌國東大山有寺羅漢造舍高百尺石佛高七丈上有石蓋七重懸空相去各三尺傳云羅漢願力或云神力或藥術之力云西方至摩臘婆五印之境有此國及摩竭提重學名僧甚勝國南至海西北踰諸國至瞿折羅西印土境渡信度河至信度國西以至狼揭羅臨西海海島中有西女國北踰諸國至迦畢試界東臨北印西至弗林波斯國其餘諸國風物茲不具録如西域志釋迦方譜可備悉之印度此云月以居諸國之中如星中月此西域之正名天竺身毒訛稱也北背雪山三垂大海地形南狹如月上弦川平地廣周九萬里七千餘城依止其中盡三海際一王所治漢書云其國殷平和氣靈智所降賢懿挺生神迹詭怪理絶人區靈應明顯事出天外光明云八萬四千城邑聚落仁王經十六大國五百中國十萬小國楞嚴云此閻浮提大國二千三百樓炭經蔥河以東名為震旦唐彥琮法師云蔥嶺已西並屬梵種鐵門之左皆曰胡鄉別胡梵南洲一地大約五分中分為雪山蔥嶺南分為五印度乃昔金輪聖王之所治是梵天之種世稱其國名天方亦名婆羅門國此云淨行淨志西分為覩貨羅波斯諸國西夷所居北分為胡虜之鄉突厥可汗烏孫胸奴所居東分為二其沙河以西有胡人吐蕃所居積石之東為震旦國乃帝王所化是君子之國封域分殊應須甄別不當以梵為胡而自混濫有以天竺為胡國者斯言大誤又有稱胡經胡語等皆非正言當云梵經梵語可也論中夫法王利見未隔中邊適化無方豈專形教雖大雲普澤而敗種難榮晨旭高暉而覆盆不照致使疑信相半邪正交陳而大悲之光曾無間然也或曰華夏得天地之中九州之外皆邊夷耳斯不足辨觀西域圖可知今為未知者更復明之考諸經論其義有九一名聞本行經云護明菩薩謂天人金團曰往昔補處菩薩託生之家須具六十種功德三代清淨汝下閻浮為我觀察金團曰迦毗羅城王名淨飯夫人名摩邪于諸世間具足功德清淨有大名稱堪生彼家護明曰善吾定生彼如是佛自親選諸天共聞則知迦毗羅國名聞最勝為諸國之中普曜經亦同二里分大地廣博世莫能窮右今無人至西北海者況知地之中邪世俗謂中國者自論此方之中耳非天下之中也依周公測天地定豫州為中云四邊各五千里豫至東海無五千里之西之北不知其幾萬里而云五千里邪禹貢言各二千五百里當時地狹後漸開濶至漢方可九千里今又較濶依內經大地周二十八萬里徑九萬里若以東西九萬里畫為九分則華方在極東一分之間耳西去更有八分之地天竺在五分之中東西去海各四萬五千里當知我國是大地之東天竺為大地之中明矣三山王天下諸山皆自崑崙發脈而來最極高廣羣峯拱峙周萬餘里龍神所宅非人力可登其枝條分布為衆山之原雖屈伸睽顧起伏萬狀而根脈相連如竹園然或近出兩笋伏地行鞭至遠處又出兩笋崑崙左邊分數支其一支走東度流沙磧石迤𨓦發為震旦諸山一支走東南發起東印度諸山次東又為百夷諸山右邊分數支一支走西南生起西印度諸山一支走西為活國波斯諸山前面為黑山雪山及北印諸山至中印多伏少出後面為蔥嶺生出北胡等山衆山飛走其下高聳衆峯之上崑崙居大地之中五印度在崑崙之南俗書以雪山東支名崑崙山借名也四水源水之為物其性趨下莫不本出于山而末入于海也雪山之頂有大龍池周千餘里為天下諸河之總源從池四面各出一大河河濶四十里波濤澒涌趨于四方各與五百河俱流入于海池東之水皆向東流池西之水皆向西流池南之水皆向南流池北之水皆向北流四隅亦爾蓋地形如團瓢其頂即雪山在極高處四面漸下故爾震旦諸水皆東流者以居地之東隅也是知山當地中池居山頂此池為大地水源之中中印度正與龍池相對五地臍梵網經云釋迦牟尼佛于寂滅道場坐金剛華光王座正法念處經云一切世間閻浮提國悉無此座金剛座處八萬四千由旬佛坐此座得佛菩提餘地不能持佛西域志云中印度恆河南摩竭提國國西南渡尼連禪河十里有菩提樹樹下有金剛座千佛坐之入金剛定俱舍論云此座下連金輪故名金剛座三世諸佛皆于此座成道降魔故知金剛座是地之臍六輪王人有勝德必居勝地夫金輪王者為閻浮人中福德之最勝者也諸人王中皇帝之聖神者也故有金輪表瑞七寶呈祥相好莊嚴千子圍繞御龍馬而飛空四洲粟王望德而歸化故輪王出世必生中土其中土者即中印度也歷代輪王出興之處名殊勝者以此七梵字梵字猶古篆也自開闢來即有其文歷萬萬餘年古今不易不同此方文字篆𨽻遷訛元從梵天傳來故曰梵書金銀輪王遞相承用故書梵字處妖魅遠離唱梵音時鬼神敬畏蓋天帝之玉音孰敢不敬奉哉是以諸佛説法皆用梵音天龍八部遵奉流行以至呼天天應召蟲蟲馴通幽徹明至靈至神者其惟梵音乎詮梵音者是為梵字總持經中明諸利益如存阿字而入定觀字輪而明心唵字出供可以上獻諸佛紇哩舒光可以下拔群苦能令染者淨愚者智夭者壽病者痊摧邪輔正饒益群生者其惟梵書之用乎世間文字有六十四種第一梵書第二佉樓書乃至蓮華樹葉右旋擲轉至六十四書名一切種音六十四種書中梵書為第一故知梵書為文字之王八氣和塞暑之宜隨方起用蓋地有隆卑氣有燥溼故涼燠不同夫氣得其中則和失其中則戾矣所以極南蒸熱極北苦寒濵海風溼蠻山瘴癘土有沃壤火沙水有啞泉苦井者非得氣之偏乎至如印度之方夏不太熱冬不嚴寒四序溫和五塵佳妙迦毗奇色之天華唐玄奘至中印見奇異天華采種而東歸渡河遭風其華種盡失疑龍所奪去解谷正音之律竹漢志黃帝使伶倫往昆侖之陰解谷取竹斷兩節間而吹之為黃鍾之宮制十二筒聽鳳鳴雄鳴六雌鳴六此黃鍾之宮皆可生之是為律本至治之世天地之氣合以生風天地之風氣正十二律定以至藥王之樹雪山有藥王樹嗅者嘗者觸者諸病皆痊肥膩香草雪山生此草牛食之乳為醍醐糞如檀香之氣地中甜味雪山地中有甜味潛流理筒可取斯亦醴泉之類龍池甘藕佛世有比丘病一比丘往雪山乞藕龍施之藕徑尺味甘食之病愈良以天地之氣和故所生草木亦純粹也邵子曰天有至粹地有至精人類得之則為明哲草木得之則為芝蘭九道中名以表實事以顯理故有中土者必有中道存焉耳若夫有中土而無中道者與邊地何殊乎是以華夏聖賢言道育民以中為本曰允執厥中曰用其中于民曰中也者天下之大道也致中和天地位焉萬物育焉世聖尚爾況出世之大聖寧以偏邪之道而示于人邪所以正覺能仁生中土現勝相者生王宮具三十二相將非以中道之正法而啓悟群生者乎然而毛道凡夫棄本逐末未有聖智曰知曰見皆是迷倒遂使好同者則惡異賓此者則辭彼故是非以生惑倒以縈愛憎相形邪正相傾而罪福已成矣故我正覺聖人愍而諭之調而和之乳而藥之援而救之俾夫止紛競歸太寧捨狂妄復良誠以合乎大均以契乎本真以至于至公至純至神至妙至中之道而後已原夫群生機異執見不同或執于色或執于空執色者窒執空者流正覺示以藥言曰色即是空空即是色則色空不二為中或執為同或執為異同則儱侗異則紛紜藥言曰同者同異異者異同非同非異一觀為中或執諸法為實為虗為常為斷為大為小為遍不遍為自為他有邊無邊或即或離或欣或厭亦有亦無亦恆亦變來者去者語者默者勤者怠者清者和者讚者毀者如是等各執異見一一成偏多岐亡羊流而忘返正覺者諭之曰萬法本間而人自閙空實無華翳者妄見人波鬼火水性無殊猿猴捉月癡狗逐塊演若迷頭馳走東西狂性自歇歇即菩提又曰譬如船師不住此岸不住彼岸而運渡衆生至于彼岸曰學道如牧牛執杖視之勿令東西犯他苗稼如御馬執轡在手惰則䇿之逸則制之從容乎中道而行矣如陶師調泥不殭不軟方中輪繩可作盆瓶如琴師調弦不緩不急方可奏曲適其中而道可期矣夫受病異緣施藥多方故有事中有理中有俗中有真中有漸中有頓中有小中有大中有初中有終中有至中有圓中有中戒有中定有中慧有中觀有中行有中因有中果若摩尼之應色空谷而答響矣以至飲食衣服行住坐臥大小諸事自行化他靡不示之以中佛自日中一食令諸比丘過中不食食之不飢不飽衣制三衣不奢不裸行則直行坐則趺坐調身則不寬不急調息則不澀不滑調心則不沈不掉至于沈浮兩捨惺寂雙流不出不入寂而常照照而常寂心心無間中中流入中道之海洎乎中之至也亡違順等怨親泯同異一死生齊物我通古今混虗空為一體現山海于毛端一語一默一動一靜而普饒益與衆生夫如是則豈其所謂世智之狂解無想之癡禪邪來從中來故曰如來去從中去故曰如去即善逝也中非動是誰來中非靜是誰去非動非靜無來無去者其至人之蘊乎非動靜而動靜無來去而來去者其悲雲之妙乎無來而來雖生不有無去而去雖滅不無是故如來之道不可以動靜來去有無生滅而言也是則超諸數量絶諸對待不可思議至玄絶妙之道歟世有河邊居人不信海水味鹹有海翁取一勺以示之使知鹹味耳豈曰大海可勺而盡之哉論仙道仙遷也人之形神能遷而不死者也世俗言仙有幾等不同有天仙神仙人仙地仙鬼仙或遊人間或隱深山如天台匡廬鼓山終南等或居海島如逢萊瀛洲闐苑小有等山島或在地下昔人遊地穴見九館諸仙人皆長年不死古人曾見故世多羡慕世人惡短夭愛長壽凡見百歲餘者已呼為仙況千萬歲者不知彼亦有無常但壽長耳非永不死也比人為優比天為劣天人壽長多經劫數視彼仙人壽短等如蜉蝣耳仙道雖妙固不如天人天人雖優又安得如聖人超數量契常樂永不為生死之所仙而億劫常存者乎華嚴云神仙山中五通仙人充滿其中此居七金山中乃天仙也楞嚴經佛言復有從人不依正覺修三摩地別修妄念存想固形遊于山林人不及處有十種仙彼諸衆生堅固服餌而不休息食道圓成名地行仙堅固草木而不休息藥道圓成名飛行仙服藥草久身輕飛舉堅固金石而不休息化道圓成名遊行仙煉丹化骨點石成金堅固動止而不休息氣精圓成名空行仙調氣固精遠形涉空堅固津液而不休息潤德圓成名天行仙咽精離欲氷雪綽約堅固精色而不休息吸粹圓成名通行仙服虹飲霧粹氣潛通堅固呪禁而不休息術法圓成名道行仙能以術法述遵自然堅固思念而不休息思憶圓成名照行仙想頂出神觀臍煉丹堅固交遘而不休息感應圓成名精行仙坎離匹配采精攝術堅固變化而不休息覺悟圓成名絶行仙存想化理邪悟變化是等皆于人中鍊心不修正覺別得生理壽千萬歲休止深山或大海島絶于人境斯亦輪回妄想流轉不修三昧正定也報盡還來散入諸趣龍舒居士曰楞嚴經説有十類仙壽千萬歲休止深山數盡復入輪回為不了真性與六道衆生同名七趣世之學仙者萬不得一縱使得之不免輪回為著于形神不能捨去故也且形神者乃真性中所現之妄想皆非真實欲求長生莫如淨土不知修此而學神仙是捨目前之美玉而求不可得之碔砆豈不惑哉唐香山居士贈王山人詩曰聞君減寢食日聽神仙説暗待非常人潛求長生訣言長本對短未離生死轍假使得長生才能勝夭折松樹千年朽槿華一日歇畢竟同虗空何須誇歲月彭殤徒自異生死終無別不如學無生無生即無滅斷疑生信不信曰疑萬惑之所從生也不疑曰信萬善之所從出也信為入道之通衢疑為修行之大障信如風舟順水則千里可期疑如波浪洄漩則終朝尋內故經云醫王能治一切病不能治命盡之人佛能度一切衆生不能度一切不信之人故知學道以信為初如沃壤良田所種五穀必滋長也世人不信其疑有三一曰此天地日月外云何復有天地日月二曰人死形壞氣散云何神有升沈苦樂三曰不信人可成佛以謂我耳目所不及遂疑而不信矣譬之朔北人不信萬斛舟而賈客每乘之江南人不信千人帳而胡人日居之凡人不信寶嚴剎而聖人每遊處之寧曰我目所不見遂果無有乎佛具六通有天眼宿命明見洞徹十方世界無所不覩六道升沈一一遍知故以神道設教因緣示人令離苦趨樂修心練性以至于成佛佛者覺也即人人之真心本覺之性也衆生昧此而不覺如處長夜能仁朝徹悟證本真故號大覺裴相國云終日圓覺而未嘗圓覺者凡夫也具足圓覺而住持圓覺者如來也是故釋迦成道中天説有説空觀根逗教截苦之根源入道之要路俾趨吾之所趨吾之所趨者非六道非三乘乃如來正覺之趨也故曰自覺覺他覺行圓滿故名為佛然則世之儒教聖人豈不明明德而新民乎龍舒王居士曰釋氏之所以孳孳訓世者無非戒惡勸善而吾儒何嘗不戒惡勸善哉其理未嘗不同也其不同者惟儒家止于世間法釋氏又有出世間法儒家止于世間法故獨言一世而歸之于天釋氏又有出世間法故知纍世而見衆生業緣之本末此其所不同耳然則佛之所言不可以目前所不見而不信也況佛戒人妄語必不自妄語以誑人世間中人以上猶不肯妄語以喪其行止況佛乎其言可信無足疑者先賢云佛言不信何言可信夫神者我也形者我所舍也我有去來故舍有成壞然則生者非生也以神之來而形成耳死者非死也以神之去而形壞耳世之人不識其神徒見其形乃悅生惡死可不為悲乎且神之來也何自而來哉蓋隨業緣而來神之去也何自而去哉蓋隨業緣而去業緣者何哉其所作者人間之業神則隨之而生于人間所作者天上之業神則隨之而生于天上若作阿修羅之業神則隨之生于阿修羅若作三惡道之業神則隨之生于三惡道是輪回六趣無有出期然則神者自無始以來投胎易殼不得久留于一所所以然者何哉以吾所造之業非久而不盡者故神之舍于業也業盡則形壞形壞則神無所舍又隨吾今世所造之業而往矣譬如人造屋宇必居其中人造飲食必享其味故造如是業必受如是之報蓋自然之理也然則吾今世之所為可不慎哉注世人多執神隨形滅無有後報苦樂事故龍舒云形有壞神不滅爾此治病藥言也幸勿謬計而起邪見執藥成病
