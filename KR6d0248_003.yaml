body:
  text: 燕山沙門仁潮集録二廣步大地四洲圖四洲說業因捨報相山海圖山海說地動緣龍王宮金翅鳥阿修羅天修羅戰龍神身量業因地獄名八熱獄圖遊增獄圖苦報相八寒獄圖小地獄出地獄惡因閻摩王餓鬼畜生廣步大地者前來雖明一洲稍開封滯尚未盡大地不知海外四洲須彌皆在地也故次明之四大部洲圖須彌山王之外有七重金山七重香水海次第周匝七金山外大鹹水海中有四大洲八中洲及數萬小洲遍布安住鹹水海外有小輪圍山周匝圍繞此四洲等皆一地所持是為一世界輿地之圖也四大洲者依長阿含經云須彌山南有天下名閻浮提此云勝金洲新婆沙論名贍部洲其土南狹北廣縱廣七千由旬人面像此地形有大樹名閻浮圍七由旬高百由旬枝葉四布五十由旬人壽百歲少出多減中夭者多阿毗曇論云南洲衣服莊飾種種不同一生欲事無數亦有修行至死無欲者起世經云大海北有閻浮樹樹下有閻浮那檀金聚高二十由旬以此勝金出樹下因以名樹名洲順正理論云有二中洲一遮末羅新媻沙羅剎住二伐羅遮羅皆有人住俗書螺蟲録載諸國人形各異或是海中諸小洲也長阿含云須彌東有天下名弗于逮此云勝身立世云弗媻提其土東狹西廣形如半月縱廣九千由旬人面像之有大樹王名伽藍浮圍七由旬枝葉四布五十由旬高百由旬人壽二百歲樓炭經三百歲飯食魚肉以穀帛珠璣共相市易有嫁娶禮阿毗曇云東弗媻提人多欲者一生數至六七亦有修行至死無欲者食自死魚肉自不殺生頭髮剪前披後著下衣竟上衣繞順正理論云有二中洲一提訶二毗提訶皆有人住長阿含云須彌西有天下名俱耶尼此云牛貨媻沙云瞿陀尼其土形如滿月人面像之縱廣八千由旬有樹王名斤提圍七由旬高百由旬枝葉四布五十由旬人壽三百歲以牛馬珠玉共相市易阿毗曇云彼土食肉殺生人死燒尸或置水埋土嫁娶同南洲人多欲者至十或十二亦有無欲者莊飾皆披髮上下著衣順正理論云有二中洲一舍搋一怛里拏皆有人住起世論斤提樹下有一石牛高一由旬因名瞿陀尼因以名洲長阿含云須彌北有天下名單越此云最勝媻沙云俱盧洲其形正方人面像之縱廣一萬由旬有樹王名菴媻羅圍七由旬高百由旬枝葉四布五十由旬人壽千歲無有市易持生自活無我我所諸山浴池華果豐茂衆鳥和鳴四面有阿耨達池出四大河無有溝坑荊棘蚊虻毒蟲自然粳米自生也衆味具足以焰光摩尼珠置自然燒也釜鍑下飯熟光滅有曲躬樹其葉密緻天雨不漏男女宿下香樹果熟自然裂出種種衣或器或食河中寶船乘之娛樂入中浴時脫衣岸上乘船渡水遇衣便著不求本衣至香樹取樂和弦而行無有諸病形貌皆同髮紺青色齊眉而止人起欲心時熟視女人彼女隨詣園林若彼女人是父母中表之親不應行欲者樹不曲蔭各自散去若非親應爾者樹則曲覆其身隨意娛樂一日七日乃捨去懷妊七八日便生隨生男女置四道中行人出指含嗽出乳充遍兒身過七日已其兒長大男向男衆女向女衆命終不泣以人壽定滿千歲故死而不弔莊嚴置四道中有鳥名憂慰禪伽接置他方立世云其鳥啄尸至山外噉之起世經云人死有鳥銜其髮置他方世界其地柔軟隨足隱起大小便時地開坼利已還合乃前世修十善行生此洲命終生天善處阿毗曇云人多欲者一生數至四五亦有無欲者順正理云有二中洲一矩拉媻二憍拉媻皆有人住起世經云南洲人身長三肘半東西同量少肘量北洲七肘阿毗曇云南洲身長三肘半或四肘東洲八肘西洲十六肘北洲三十二肘一肘當周尺一尺八寸正法念處經云北洲人于山障外徹見無礙耳之所聞若遠若近若大若小而皆得聞東洲人于黑暗中亦見衆色耳識所緣盡一箭道西洲人眼識所緣山壁無礙眼識亦能聞聲如閻浮提蚖蛇之類眼中聞聲瞿陀尼人亦復如是如隔障礙聞衆音聲見衆色像亦復如是此言三洲報通故能洞視徹聽也南洲則隔窗紙不見外物隔障不能聞聲故不爾此槩言之南洲亦有通者如清稟禪師宴坐聞曳木聲曰勿令損階侍者不見有曳木者細視之見群蟻曳蜻蜓翼緣階而上斯亦靜極光通之謂也龍樹嗅丸而知藥品各若干分圖澄數千里見火燒城梵僧眠聞虱號而惺世人亦有明𧦴秋毫聰聞蟻鬬者楞嚴經云阿那律陀無目而見跋難陀龍無耳而聽兢伽神女非鼻聞香驕梵鉢提異舌知味舜若多神無身覺觸摩訶迦葉無意而知此皆不假六根而知六塵者比有根而知者又妙也或修得或報得經因業緣若湛流妄復圓常則真明通洞六根互用妙中又妙者也媻沙論云四大洲八中洲人形短小復有五百小洲或人住或非人住或有空者非人鬼也此胎生者化生者遍諸處因本經云閻浮五種勝三天下及至他化一勇健二正念三佛出世處四是修業地五行梵行處諸天及三天下各有三種勝閻浮一長壽二色勝三地勝阿含經云南洲三事勝一勇猛強記能造業行二勤修梵行三佛出其土分別功德論云媻拘羅尊者長壽第一于百壽中而加六十阿難問曰尊者長壽何以不生三方答曰諸佛不生三方以其土人難化故此土衆生利根捷疾極惡勇猛取道不難是故往古諸佛皆生此中經論相較南洲勝者以道三洲勝者以福然北洲福樂最勝經名為難者何邪以其雖有癡癡富樂倀倀修論無有智慧不能增修道業佛不生其土故不聞正法因名為難即八難之一也南洲有佛出世大乘根器多生其中以尊命短促衆苦逼迫怖畏發心勤修道行有益當來故為四洲之勝也業因四教儀云在因行五常五戒中品十善感人道身或作福時有正助敬慢喜怒專略多少不同故受報時亦有中邊貴賤妍精粗豐儉之不等耳阿含經云波斯匿王白佛為媻羅門還生自姓媻羅門家為復剎利舍首陀羅家邪佛言何得如是當知有四種人一從冥入冥謂有人生卑姓家若生旃陀羅家漁獵家及餘種種下賤工巧業家貧窮憔悴復作卑賤之業乃至為人作使是名冥處于此冥中復行身口意惡身壞命終當生惡處捨惡受惡故名從冥入冥二從冥入明謂有世人生卑姓家乃至為人作諸鄙業是名為冥于此冥中身口意善命終生天故名從冥入明三從明入冥謂生富貴之家聰明黠慧是名為明于此明中身口意惡命終生惡趣故名從明入冥四從明入明謂生富樂之家是名為明于此明中身口意善命終生善趣受天化生是名從明入明剎利王族也媻羅門淨志也鞞舍商賈也首陀羅農夫也旃陀羅屠膾也此印土賤貴之分冥惡也惡相愚癡昏昧之謂冥明善也善相聰明光朗之謂明三業惡則十惡具生惡處則三塗備三業善則十善具生善趣則三善道備言生天者略也謂因談善惡果通六趣皆自人道發軫者也業報差別經佛言復有十業能令衆生得人趣報何等為十一者不殺二者不盜三者不邪淫四者不妄語五者不綺語六者不兩舌七者不惡口八者不貪九者不瞋十者不邪見于十善業缺漏不全以是十業得人趣報此明總報又自行殺生勸他令殺等業得短命報自不殺生勸他不殺等業得長命報自行偷盜勸他偷盜得少資生報自離偷盜勸他不盜得多資生報好打拍衆生惱亂尊賢得多病報不鞭打衆生瞻視病苦得少病報嫌恨惱他不敬尊長得醜陋報愛敬父母賢聖施衣掃塔得端正報不敬父母沙門師長輕懱下族得下族姓報敬事父母沙門師長遵受教誨得上族姓報不咨問智慧大德沙門顯說惡法得邪智報能問智慧沙門修習多聞得正智報于三寶淨戒人所不生殷重心施生邊地報于三寶梵行人邊殷重心施生中國值佛聞法報略言別因別報詳具全經華嚴云業有現受生受後受相此即三報受報也現作現受現報也今作來生受生報也今作後後世報為後報也以因有強弱故報疾遲不一世人不知此以為無報應捨報相人死時身心昏昧如睡無夢極悶絶時明了意識必不現起六種轉識行相所緣必不能知是散有心名生死心八識也此時由善惡業下上身分冷觸漸起頌云頂聖眼生天人心餓鬼腹旁生膝蓋離地獄腳板出眼不見耳不聞五識先無心不知六識亦無身熱則八識離身即冷也驗最後何處熱若心熱即生人道餘例此言有升沈者以此俗人謂身死氣散誰受苦報彼不知有八識耳守護國界主經云佛言若人命終之時豫知時至正念分明洗浴著衣吉祥而逝光明照身見佛相好衆善俱現定知此人決定往生淨土若人念佛持戒無精進心命終亦無善相亦無惡相地府不收安養不攝如睡眠去此人疑情未斷生于疑城五百歲受樂再修信願方歸淨土若人起憐憫心正念現前于財寶妻子心無愛戀眼色清淨仰面含笑想念天宮當來迎我耳聞天樂眼見天童捨此報身定生天界若人生柔軟心起福德心身無病難憶念父母妻子于善于惡心不錯亂其心正直遺囑家財辭別而去定生人界若人于己眷屬惡眼瞻視舉手捫空便利不覺身常臭穢兩目紅赤仆面而臥踡身左脅百節酸疼或見惡相口不能言伸吟呌喚冤債現前心識散亂狂惑顛倒遍體如冰手捻死拳身硬如石此人命終定入地獄若人好䑛其唇身熱如火常患饑渴好說飲食張口不合貪戀財寶命卒難斷開眼而去此人定入餓鬼若人身染重病如在雲霧心神昏散怕聞佛名多愛食噉血肉之味不受勸化愛戀妻兒踡手足指遍身流汗出粗澀聲口中咀沫此相現前定入畜生此言人命終時心有善惡念身有好醜相以卜升沈何處也首楞嚴經云佛告阿難一切世間生死相續生從順習死從變流臨命終時未捨暖觸一生善惡俱時頓現純想即飛必生天上若飛心中兼福兼慧及與淨願自然心開見十方佛一切淨土隨願往生情少想多輕舉非遠即為飛仙情想均等不飛不墜生于人間想明斯聰情幽斯鈍情多想少流入橫生重為毛群輕為羽族七情三想沈下水輪生于火際受氣猛火身為餓鬼常被焚燒水能害己無食無飲經百千劫九情一想下洞火輪輕生有間重生無間二種地獄純情即沈入阿鼻獄若沈心中有謗大乘毀佛禁戒誑妄說法虗貪信施濫膺恭敬五逆十重更生十方阿鼻地獄此約情想多少而分升沈之相情愛染妄情也想渴仰善想也華嚴經云譬如有人將欲命終見隨其業所受報相行惡業者見于地獄畜生餓鬼所有一切衆苦境界或見獄卒手執兵仗或瞋或罵囚執將去亦聞號呌悲歎之聲或見灰河鑊湯刀山劍樹種種逼迫受諸苦惱作善業者即見一切諸天宮殿無量天衆天諸綵女種種衣服具足莊嚴宮殿園林盡皆妙好身雖未死而由業力見如是事又如正法念經將生六道有多種中有身相應知之九山八海圖九山八海者依起世因本經云第一須彌山其底平正住金輪上下狹上濶漸漸寬大四寶合成金銀琉璃頗梨生種種樹茂香遠多諸賢聖之所住處高十六萬八千由旬出水上者高八萬四千由旬長阿含同俱舍立世高廣各八萬由旬七山及鐵圍次第減半相間而住須彌山外有香水海橫廣亦八萬四千由旬俱舍八萬由旬七海次第減半有優鉢羅華鉢頭摩華拘牟陀華奔茶利迦華等遍覆水上以下海同山由旬等第二雙持山高廣各四萬二千由旬海同俱舍四萬海濶四萬第三持軸山高廣各二萬一千由旬海同俱舍二萬海亦二萬第四檐木山高廣各一萬二千海同俱舍高廣各一萬由旬海同第五善見山高廣各六千由旬海同俱舍高廣各五千由旬海同第六馬耳山高廣各三千由旬海同俱舍高二千五百由旬海同第七障礙山高廣各一千二百海同俱舍高一千二百五十海同第八持地山高廣各六百由旬海同俱舍高六百二十五由旬海同第八大鹹水海橫濶三十二萬二千由旬水際二萬三千六億八千四百七十五由旬第九斫迦羅山高廣三百由旬俱舍論輪圍山高三百一十二由旬阿毗曇周回三十六億一萬三百五十由旬包大鹹水海或云小鐵圍山乃約義而番諸山入水皆八萬由旬住金輪上諸海皆深八萬經論諸山海由旬少異且依俱舍算之從須彌中心至本山南際四萬由旬從此南際向南踰七金山七萬九千三百七十五由旬七海數同共十九萬八千七百五十由旬至鹹海北際須彌北去亦然南北通徑共有三十九萬七千五百由旬又從七山南際往南渡鹹海輪圍極南際又得三十二萬二千三百十二由旬從七山北至輪圍極北際數亦同南合有六十四萬四千六百二十四由旬也其輪圍山南北通徑總有一百零四萬二千一百二十四由旬東西徑同是為一世界之邊際也大海何故潮汐華嚴經云娑伽羅龍王宮殿中水涌出入海其所出水紺琉璃色涌出有時是故大海潮不失時百川競澍云何不溢華嚴經云有四大寶布在其底性極猛熱飲縮百川是故大海無有增減一者日藏大寶光明照觸海水悉變為乳二者離潤大寶光明照觸其乳悉變為酪三者火𦦨光大寶光明照觸其酪悉變為酥四者盡無餘大寶光明照觸其酥變成醍醐如火熾然悉盡無餘何故鹹味樓炭經云有三因緣一者海中大魚身長二萬八千里不淨其中二者世界始成自阿迦尼吒天放大雨洗蕩塵垢入之三者曾昔仙人呪之故爾地動緣何因地動阿含經佛言地動因緣有八地在水上水止于風風止于空空中風大有時自起則大水擾大水擾則普地動是為一也有時得道比丘比丘尼及大神尊天觀水性多地性少欲自試力則普地動是為二也若始菩薩從兜率天降神母胎專念不亂地為大動是為三也菩薩始出母胎從右脅生專念不亂地為大動是為四也菩薩初成無上正覺地大震動是為五也佛初成道轉無上法輪魔若魔天沙門媻羅門諸天世人所不能轉則普地動是為六也佛教將畢專念不亂欲捨壽命則普地動是為七也如來于無餘涅槃而般涅槃時大地震動是為八也華嚴經菩薩說法地六種震動二經地動皆吉祥若修羅大戰地動則凶又正法念處經云非法惡龍起大瞋恚震動大水或一百二百三百由旬地住水上以水動故大地亦動世間或言災儉豐樂兵起水旱等復有異因緣地動地下有持風持風動故大水動大水動故令大地動五十由旬或一百二百三百由旬隨風廣狹水動亦爾如水廣狹地動亦然又二種動若善因緣動衆生豐樂無諸衰患若諸衆生作不善因緣動者衆生則有不善事起又阿修羅與天鬬戰地大震動龍王國樓炭經云須彌山北大海水下有娑伽龍王宮宅縱廣八萬由旬寶城欄楯園林衆寶莊嚴華嚴經云娑竭羅龍王宮殿中有四寶珠能生海內一切珍寶龍王太子閻浮幢之宮殿及大奮迅龍王等八十億諸大龍王宮殿各別龍有五種謂蛇龍蚊龍魚龍象龍蝦蟇龍娑竭羅龍王現大自在力饒益衆生從四天下乃至他化興種種色雲出種種色電光震種種雷聲復起涼風然後乃降種種諸雨雖彼龍王其心平等但以衆生善根異故雨有差別阿那媻達多龍王興大密雲遍閻浮提普霪甘雨百穀苗稼皆得生長江河泉池一切盈滿正法念處經云大海中深萬由旬城名戲樂縱廣三千由旬龍王滿中有二種龍王一者法行二者非法行一護世界二壞世間法行住處不雨熱沙非法住處常雨熱沙焚燒宮殿及其眷屬若人順法孝養父母供養沙門修行正法令法行龍王增長大力以善心故降微細雨五穀熟成色香味具無諸災害果實繁茂衆華妙色日月晶光威德明淨福德龍王不放毒風若諸衆生不行善法不孝父母不敬沙門及媻羅門惡龍增長勢力作大惡身以惡心故起惡雲雨惡風吹氣入水雜毒五穀斃惡食者病苦令人短命惡龍災毒遞互相害以非法龍作諸惡故大雲請雨經佛在龍王宮說法敕召大雲輪蓋龍王娑伽羅龍王等諸大龍王大音者電舌者寶冠蛇身者千頭赤眼者雲雷響者耀雲光者睒電冠者乘大雲者持大雨持大風輪于閻浮提降澍大雨依內經風雨雷電皆龍神主之外書云是陰陽氣變陰包陽陽奮出為雷軋磨光發為電陰和陽為雨又陽和陰為雨露陰和陽為霜雪此但道其緣而不知其因也迦樓羅國此云金趐鳥經云大海之北有大樹名居吒奢摩離其本周七由旬入地二十由旬其身出高一百由旬枝葉四布五十由旬樹東有卵生龍及卵生金翅鳥宮殿廣六百由旬樹南有胎生龍及胎生金翅鳥宮殿樹西有溼生龍及溼生金翅鳥宮殿樹北有化生龍及化生金翅鳥宮殿其金翅鳥王若搏取諸龍時即飛往樹上下觀大海便以兩翅扇大海水水為之開一千六百由旬即便銜取諸龍隨意而食四生龍等皆為鳥王等食噉惟不能取娑竭龍王及難陀優鉢難陀提頭賴吒龍王阿耨媻達多龍王等及諸龍中有受三歸六齊八禁者皆不能食昔諸龍苦金翅鳥白佛佛賜袈裟令分而披之諸龍若得挂一縷者金翅鳥則不能吞噉其苦遂息阿修羅國此云非天福力等天而無天德為多瞋慢故經云須彌山東去千由旬海下有摩質多羅阿修羅王國土住處海水在上風持如雲縱廣八萬由旬七重寶城及寶樹園苑等宮城廣萬由旬中有宮殿廣千由旬諸修羅宮大小各各不同山南有踊躍阿修羅王宮殿山西有奢媻羅阿修羅王宮殿山北有羅睺阿修羅王宮殿國土寶樹人民與東國同正法念處經云大海地下天之怨敵名阿修羅有二種一鬼道攝魔身餓鬼有神通力二畜生攝住須彌側在海地下八萬四千由旬有四地第一地二萬一千由旬是羅睺阿修羅王住處于欲界中化身大小隨意能作其所住城名曰光明縱廣八千由旬無量寶林流泉浴池壽五百歲人間五百年為一日一夜第二地在一地下二萬一千由旬是勇健阿修羅王住處縱廣一萬三千由旬城名星鬘壽六千歲人間六百年為一日一夜第三地在二地下二萬一千由旬是華鬘阿修羅王住處縱廣一萬三千由旬城名含毗羅縱廣八千由旬壽七千歲人間七百年為一日一夜第四地在三地下二萬一千由旬是毗摩質多羅王住處廣博六萬由旬城名含毗羅廣一萬三千由旬楞嚴經復有胎卵溼化四種修羅天與修羅鬬戰正法念處經云阿修羅欲與天戰時先遣惡龍行惡風雨壞南洲人百穀以人行善業諸天增盛故欲壞之如壞樹根法行善龍王雲迎教誡順法善龍常護善人故來救之惡龍不聽遂相鬭諍雷火交戰時人間善力多則善龍得勝惡龍敗退修羅復使官軍來戰時人間行惡多則修羅衆勝龍衆敗走乃勞空行夜叉踊身飛空上請天兵夜叉有光迅飛如流世人謂之流星口中出烟世人云星天兵復勝修羅敗小修羅王復出大軍合戰天龍不勝故四大天王出四部大兵而擊之修羅王軍不勝共請大阿修羅王王忿怒踊身起座大地搖動難陀龍王以尾打大海雨至忉利帝釋見地動雲擾知修羅侵境敕三十二天入質多羅林各擐金剛甲胄各持金剛刀劒弓箭鉞叉罥索器杖等以備之其大修羅王率領四國諸修羅衆無數千萬出大海水各執器杖升空而上與四天王共戰四王見彼勢重升須彌頂上奏帝釋帝釋于是乘其象龍敕諸天王召集天兵從空而下然修羅王兵已至山脅帝釋以善言誡諭其王罵曰捉汝縛汝天王敕令發兵日天子在前放大光明射修羅目其王目盲不見天衆乃以手障日人間以為日蝕天福德力不能加損令修羅戰于是二陳相合最極雄猛世間大戰無過于此王與王戰官與官戰軍與軍戰龍與龍戰乘大雲擊大鼓運大神力其鬬不一或執劒戟或執矛槊或雷電辟歷或宮殿刀輪有取大石有取大樹有水鬬者雨火鬬者拳鬬者呌鬬者幻術鬬者或雨刀雨箭及雨石山或相擒相縛相傷相殺故損耳損目及手足等天人身分損已復生修羅遭傷手足墮落不能復生若頭落心傷則死天人雖中流矢穿身而過過已還合但覺痛觸若頭落腰斷亦死是時也須彌搖動大海沸涌魚龍出沒驚惶鼓舞阿修羅王現神通力有五百頭五百手取大山三百由旬走向天衆天王以箭射山碎如沙末又取大山五百由旬擲向帝釋伊羅象王以鼻取山返擲修羅中𮌎身傾天人唱言曰畜生白象打汝象王現神通力化為千頭口出火𦦨化身無數遍虗空界帝釋奮威現身有千頭千臂執金剛杵流金剛𦦨化身無數各乘象王皆向修羅震威驅逐修羅王見帝釋神變畟塞虗空心生恐怖攝諸軍旅奔逃而下三十二天及四天王神兵億載飛刃如落華流矢如秋雨共追修羅帝釋說慈心令攝諸神兵復還忉利解甲胄易天衣帝釋升殿諸天王禮賀帝釋說法教誡諸天勤修戒善慎勿放逸諸天奉行各還本宮伊羅象王歡喜踊躍鼻出二河遍灑四洲甘雨七日百穀滋茂亦還寶窟天與修羅共戰其勝負之低昂皆與人間之善惡相關者何邪得非感應各從其類歟何則夫天善也人善則與天道冥通如火加薪而火熾故天增力而勝修羅矣修羅惡也人惡則與惡道相通如未添流而波大故修羅增力而勝天矣性性溜合而莫之逆也所以影響相符同時不忒譬之陽燧對日而火形銅出崩而鐘聲應是亦感應各從其類焉夫天之勝負低昂即人之善惡消長人之善惡消長即天之勝負低昂是以天人一體凡聖同原雖尊𢍉之有異其理性則一而已然則泰山何待撮土而後為高哉曰人善者益其性矣益性者培其本也根本壯而枝葉自茂也如其斤之毀之剔其根本者則枝葉不期枯而自枯矣曰若爾人善果有益于天邪曰非益天也還自益也故天龍歡喜灑甘露以澤地而人民得食得壽也是果惟益于天乎故古德云善逐心生如珠生光而還照珠髓其斯之謂歟曰如是天則果益于人邪曰非益人也是益自也人能增道進善而天益光明福樂倍盛也是果唯益于人乎故普賢云如大樹王若根得水枝葉華果悉皆繁茂以大悲水饒益衆生則能成就諸佛菩薩智慧花果亦猶世教善治國者先安人民民安則國固其義同也是故天人表裏相須而成者也天人之所以為天人者皆戒善而為其本也苟世間不行戒善則天人損滅修羅增盛惡雨火風五穀不登則人遭塗炭之苦矣故法華云佛未出世時三惡道充滿諸天衆減少阿修羅增盛信矣伏願共修戒善以合天心以和召和細雨清風醴泉為飲嶙鳳為乘修羅勝則凶天勝則吉相持者半吉莫若無寇不戰方為大吉身量阿含經云大獸之中難陀跋難陀二龍其形最大繞須彌山七匝頭猶上頂尾在海中目犍連尊者所降者即此二龍王菩薩處胎經云第一大鳥不過金翅頭尾相去八千由旬高下亦爾若其飛時從一須彌至一須彌終不中止莊子鵬之背不知幾千里飛時擊水三千里翼若垂天之雲此金翅鳥之小者耳俗書名鵬華嚴經云三十三天共阿修羅鬬戰時諸天得勝修羅退衄阿修羅王其身長大七百由旬四兵圍繞無數千萬以幻術力將諸軍衆同時走入藕絲孔中又偈云如阿修羅變化身蹈金剛際海中立海水至深僅其半首共須彌正齊等化身長十六萬八千由旬故海深止齊腰耳四分律云摩竭大魚身長或三百由旬四百由旬極大者長七百由旬故經云眼如日月鼻如大山口如赤谷俗書說水獸大者不過巨靈之龜其形最大首戴蓬萊山海中游戲此龜未及小小之摩竭律中舍利弗漉水而飲漉多遍猶有細蟲遂七日不飲身形枯憔佛問其故對曰佛令漉水而飲我以天眼觀蟲猶尚過器中粟水沙以護生命不敢飲水故爾佛言若以天眼觀一切人民無有活者自今已後但聽肉眼看水清淨得飲衆生受報極小者形如微塵凡眼不見故知業力幽臭不可思議非凡情能測惟佛大聖乃能盡知盡見故號如來為正遍知業因阿含經云皆先大布施由心高凌虗苦惱衆生心多瞋慢生金翅鳥中以瞋慢故生畜生中以布施福德故為鳥中王宮殿莊嚴又先多瞋恚心曲不端大行布施及喜調戲犯戒鬬爭誹謗經戒故墮龍中由施福故以七寶為宮殿正法念經于人中時愚癡瞋恚心焚燒僧房聚落城邑如是惡人命終墮地獄受無量苦從地獄出生于龍中受畜生身熱沙所燒于前身時施會供養外道行不淨施雜漏不堅以食施破戒雜行之人心無正思如是施已命終生阿修羅中有下中上等業報經云由身口意三行微惡業憍慢邪慢等得阿修羅報又由瞋慢疑三因得修羅報亦作諸福業諂曲好勝故報修羅經言心高凌虛為鳥心曲不端為龍及人道中殺生得短命偷盜得貧窮輕慢得下姓恭敬得上族所謂形端則影直聲和則響順未見貌醜鑒鏡有悅目之華體短照水發超群之觀者也地獄總名地獄者梵語名泥犁邪此云非道欲界最下劣故毗曇又名捺落迦此云惡人乃造罪惡人所住之處媻沙論媻沙論云贍部洲下有大地獄洲上亦有邊地獄及獨地獄或在谷中山上或在曠野空中海邊廟中餘三洲唯有邊獨地獄無大地獄有說北洲無獄地獄有情其形如人口出種種受苦痛聲乃至無有一言可了地獄銅鐵所成亦有鐵城劒樹沸河鐵網等諸莊嚴斯惡道有多種總為三一熱二寒三邊一八熱地獄圖熱地獄者依媻沙論南洲下至無間共四萬由旬上尖下濶猶如穀聚薩媻多論南洲下土泥五百由旬白墡五百由旬等活至極熱七獄共高一萬九千由旬各廣萬由旬無間高廣各二萬由旬法苑偈云初七各濶五百旬後一三十二萬里縱廣正等銅鐵成有情上品惡所生因本經云四大洲諸山王外別有一山名鐵圍高六百八十萬由旬縱廣亦爾金剛所成此山外復有一重大鐵圍山高廣正等兩山之間極大黑暗無有光明日月有八大地獄謂活大地獄等無間去聲下同壽量者按阿毗曇論云等活壽五百歲黑繩千歲次第倍增至炎熱一萬六千歲極熱半劫無間一劫俱舍論云等活一晝夜當四王天五百歲次第至炎熱一晝夜當他化天一萬六千歲較量壽命經云等活一晝夜比人間一萬六千二百俱胝年俱胝此云億數黑繩一晝夜比人間三萬二千四百俱胝年加一倍為二衆合一晝夜比人間六萬四千八百俱胝年加二倍為四呌喚一晝夜比人間十二萬九千六百俱胝年加四為八大呌喚一晝夜比人間二十五萬九千二百俱胝年焰熱一晝夜比人間五十一萬八千四百俱胝年十六遊增小地獄圖地藏經云閻浮提東方有山號曰鐵圍其山黑邃無日月光有大地獄號極無間又有地獄名大阿鼻復有四角飛刀火箭夾山等二十四名又有呌喚獄等二十二名是等地獄其數無限一二三四乃至百千諸有地獄在大鐵圍山之內其大地獄有一十八所次有五百名號各別無間獄者其城周匝八萬餘里純鐵成高一萬里城上火聚少有空缺城中諸獄相連名號各別中有一獄名曰無間周萬八千里獄牆高一千里悉是鐵為上火徹下下火徹上鐵蛇鐵狗吐火馳逐獄牆之上獄中有牀遍滿萬里一人受罪自見其身遍臥滿牀千萬人受罪各各自見身滿牀上衆業所感獲如是報成實論云五無間者一趣果無間捨身即生彼故二苦無間中無樂故三時無間定一劫故四命無間中不絶故五形無間此獄縱廣八萬由旬一人亦滿多人亦滿故多論二萬由旬苦報相薩婆多部有八大地獄一等活阿含名想亦名更活謂罪人手生鐵爪遞相瞋忿相爴肉墮又手執刀劒遞相斬割身碎在地死已冷風吹活或獄卒唱生罪人自想我今已活故名想亦名活久受苦已出想地獄慞惶馳走至黑砂獄黑砂苦畢次至沸屎獄次第乃至第十六寒冰獄然後命終由身口意造不善業墮斯地獄二黑繩獄謂以熱鐵繩絣直罪人鐵斧斫碎又絣鋸之或風吹鐵繩歷絡其身皮骨焦爛苦毒萬端久受苦已出黑繩獄至黑砂乃至寒冰然後命終由惡意向父母佛及聲聞墮此獄中三衆合獄經名埠壓或兩山合壓骨肉糜碎或鐵象踏身或鐵杵搗之大石壓之膿血流地衆苦竝至久受苦已出衆合獄次至黑砂等獄同前由造三惡業行墮此獄中四呌喚獄獄卒捉罪人擲鐵鑊中或擲大𨫼上啼咷呌喚久受苦已出叫喚獄至十六小獄中同前由瞋恚懷毒造惡墮此獄中五大呌喚獄取罪人著鐵釜鑊中及𨫼上返覆煎熬遂大呌喚久受苦已乃出同前由邪見造異陋行墮此獄中六炎熱獄阿含燒炙將罪人置鐵城中或鐵樓上鐵陶中內外赤然燒炙焦爛罪畢得出同前為燒炙衆生故墮此獄中七極熱獄阿含大燒炙將罪人置大火坑或鐵叉貫之火中燒炙罪畢得出同前由捨善果業造衆惡墮此獄中八無間獄獄卒剝罪人皮纏身上著火車上輪碾往返鐵城大火交射萬毒竝至凡所遇者皆惡色惡聲惡臭惡觸無彈指歇故名無間久受苦已次至黑砂十六小獄同前由造極重罪十惡五逆也墮此獄中正法念經云阿鼻苦千倍遇前七大地獄阿鼻此云無間觀佛三昧經云阿鼻地獄縱廣八千由旬七重鐵城七重鐵網有十八鬲子朗的切鼎屬周匝七重皆是刀林四大銅狗十八獄卒八頭六十四角六十四眼有七鐵幢火涌如沸若有罪逆命終之時銅狗化十八車狀如寶蓋一切火𦦨化為玉女罪人遙見心喜欲往風刀解體寒急作聲寧得好火安在車上即便火然罪人命終來坐火車屈伸臂頃直入阿鼻從上鬲下如旋火輪至于下鬲化閻羅王大聲告敕癡人獄種汝在世時不孝父母邪見無道汝今生處名阿鼻獄如是大苦一日一夜如人間六十小劫如是壽命盡一大劫具五逆者受罪五劫復有衆生犯四重禁虗食信施誹謗邪見不識因果斷學般若毀十方佛偷僧祗物淫逸無道此人罪報經八萬四千大劫復入東方十八鬲子如前受苦南西北方亦復如是阿鼻即無救也二八寒地獄圖一頞浮陀地獄寒苦所切肉生細皰二尼賴浮陀獄寒風所吹通身成皰三阿吒吒地獄唇動不得唇作此聲四阿波波地獄舌動不得唇作此聲五嘔喉喉地獄喉內振氣作此聲故六波羅地獄肉色細拆如青蓮華七波頭摩地獄肉色大拆似赤蓮華八芬陀利地獄罪人骨折似白蓮華一二從身相受名三四五從聲相受名六七八從瘡相受名此八獄在鐵圍山底仰向居止受寒凍之苦毗曇論云佛說各各世界外邊有黑暗大地獄日月光明所不能照兩界鐵輪山外是寒地獄有十一名遏浮陀至十名波頭摩因冷風吹觸其身坼破𪹼聲吒吒耳聞相知其最狹處八萬由旬在下無底向上無覆其最廣處十六萬由旬三法度經云頞浮陀壽如憍薩羅斛量胡麻二十斛有一丈夫滿百年取一粒如是取盡復以二十頞浮陀壽為一尼賴浮陀壽次第準此㽵椿録云復有十地獄第一遏浮陀此云肉段罪人遭凍身肉段坼壽一媻訶麻智論二十斛油麻觜量名一婆訶人間過百年除一粒候草斛麻盡方出此地獄二泥羅浮陀此云疱凍的肉綻成疱壽的二媻訶麻三阿呼呼忍寒之聲壽四媻訶麻四呼呼媻忍寒長聲壽八媻訶麻五阿吒吒舌動之聲壽十六媻訶麻六搔乾提迦火焰如此花色壽三十二媻訶麻七優鉢羅火焰如青蓮花色壽六十四媻訶麻八拘尼陀焰如此花壽百二十四媻訶麻九奔茶里迦焰如此花壽二百五十六媻訶麻第十波頭摩火焰如之壽五百一十二媻訶麻一萬二百四十斛麻已上十獄各各銅鐵所成一一縱廣一百由旬前五寒冰後五熱焰前前壽限轉短于後後後苦惱倍勝于前各有十億小獄而為眷屬三邊小地獄三法度經云一山間二水間三曠野受別業報㽵椿録孤獨地獄在閻浮提諸處或曠野山間海畔廟中有八萬四千座苦報轉輕此等小獄應寒熱雜受苦有多少壽有延促海邊如僧護所見諸獄山間如泰山鄷都又如億耳所見等出地獄觀佛三昧經云阿鼻死已生寒冰中寒冰死已生黑暗處八千萬歲目無所見受大蟲身宛轉腹行狐狼牽食後生畜生中五千萬身受烏獸形後生人中聾盲瘖啞疥癩癰疽貧窮下賤經五百身復生餓鬼道中遇善知識及菩薩呵責改悔稱南無佛稱佛恩力尋即命終生四天處悔過自責發菩提心業因業報差別經云身口意三行重惡業起斷常諸邪見等業得地獄報經中多以五逆十惡謗法等業墮地獄中㽵椿録云第一根本極重之罪殺父母殺阿羅漢破和合衆逼奸淨尼出佛身血無有懺悔五逆之罪及上上品十惡業感八大地獄上中品十惡生寒冰等地獄上下品十惡生孤獨小地獄中以上十惡皆是總因更有別因如毀謗賢聖妄言惡口死入地獄洋銅灌口拔舌犁耕烹煮衆生受鑊湯報剝奪人衣受寒氷報此等別因遍諸經論茲不具録那先比丘問佛經云如世間火熱不如泥犁中火熱如持小石著世間火中至暮不消取大石著泥犁中即消惡業人在中多歲不死亦如蛟龍食石即消如人懷胎其子不消善惡業力致消不消人作善惡如影隨身人死但亡其身不亡其行如然火夜書火滅字存火至後成今世所作後世成之閻王住處起世經云閻浮洲南二鐵圍山外有閻摩羅王宮殿縱廣六千由旬七重牆壁七重欄楯七重金網七重行樹園苑花池種種美果衆鳥和鳴王以惡業故晝夜六時自然有赤融銅汁在前宮殿即變成鐵五欲功德皆沒王見此已怖畏不安即時入內時有獄卒取王撲鐵地上以融銅汁瀉置口中從下而出王作是念往昔作惡今受此苦願我捨身人間受生如來法中正信出家發是善念已宮殿還成七寶五欲具足彼諸大臣亦復如是經云閻羅王昔為毗沙國王與維陀始王戰兵力不敵因立誓願為地獄主臣佐十八人領百萬衆同立誓曰後當奉助治此罪人毗沙王者今閻羅王是十八臣者今諸小王是百萬衆者諸阿傍是正法念經琰摩羅此言雙王兄主男獄妹主女獄餓鬼正法念處經云餓鬼有二種一者人中住二者住餓鬼世界是人中鬼若人夜行則有見者餓鬼界者住閻浮下五百由旬長三萬六千由旬及餘餓鬼眷屬其數無量住閻浮提有近有遠略說有三十六種鑊身針口食吐食糞食氣食水希望食唾食鬘食血食法食肉食香烟疾行伺便地下神通熾然伺嬰兒便欲色海渚閻王執杖無食食小兒食人精氣羅剎燒食不淨巷陌食風食火炭食毒曠野冢間食熱灰樹中住四交道殺身略說三十六種廣則無量衆生重心造惡業行各異種種慳心不行布施貪心因緣生餓鬼身畜生觀諸畜生種類差別三十四億隨心自在生于五道于五道中畜生種類其數最多種種相貌行食不同群飛各異憎愛違順伴行雙隻同生共遊所謂飛禽走獸烏鵲鵝鴈鴻鳥衆類異群別遊不相怨害狐狗野干等互相憎嫉烏與角鴟馬及水牛蚖蛇鼬等共相殘害形相不同行食各異觀是衆生為種種心之所役使作種種業入種種道噉種種食或受化生蠶峨及細蟲身或溼生龜鱉魚蟹蚌蛤及諸細蟲蚊虻蚤虱受胎卵溼化身依地水火木而住大身細身無數種類
